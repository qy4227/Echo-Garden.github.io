                    model: state.apiConfig.model,
                    messages: messages,
                    //temperature: parseFloat(state.apiConfig.temperature) || 0.7,
                    max_tokens: 2048,
                    stream: false
                };

                // 添加超时设置
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                response = await fetch(state.apiConfig.url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.apiConfig.key}`
                    },
                    body: JSON.stringify(requestBody),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                const responseText = await response.text();

                if (!response.ok) {
                    let errorMessage = `API请求失败: ${response.status} ${response.statusText}`;
                    try {
                        const errorData = JSON.parse(responseText);
                        errorMessage += ` - ${JSON.stringify(errorData)}`;
                    } catch (e) {
                        errorMessage += ` - ${responseText.substring(0, 200)}`;
                    }
                    throw new Error(errorMessage);
                }

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    if (responseText.includes('<!DOCTYPE') || 
                        responseText.includes('<html') || 
                        responseText.includes('HTTP') ||
                        responseText.includes('nginx') ||
                        responseText.includes('Apache')) {
                        throw new Error('API返回了HTML页面，请检查API地址是否正确');
                    }
                    
                    if (responseText.trim().length > 0) {
                        return responseText.trim();
                    }
                    
                    throw new Error('API返回了无效的JSON格式');
                }

                // 兼容不同API响应格式
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    return data.choices[0].message.content;
                } else if (data.choices && data.choices[0] && data.choices[0].text) {
                    return data.choices[0].text;
                } else if (data.response) {
                    return data.response;
                } else if (data.content) {
                    return data.content;
                } else if (data.message) {
                    return data.message;
                } else if (data.result) {
                    return data.result;
                } else if (data.text) {
                    return data.text;
                } else if (data.answer) {
                    return data.answer;
                } else if (data.reply) {
                    return data.reply;
                } else if (data.assistant) {
                    return data.assistant;
                } else {
                    for (const key in data) {
                        if (typeof data[key] === 'string' && data[key].length > 0) {
                            return data[key];
                        }
                    }
                    return '收到。';
                }
            } catch (error) {
                console.error('API调用详细错误:', error);
                
                // 提供更具体的错误信息
                if (error.name === 'AbortError') {
                    showAPIStatus('请求超时，请检查网络连接或API地址', 'error');
                } else if (error.message.includes('CORS')) {
                    showAPIStatus('跨域请求被阻止，请确保API支持CORS', 'error');
                } else if (error.message.includes('HTML页面')) {
                    showAPIStatus('API返回了HTML页面，请检查API地址是否正确', 'error');
                } else if (error.message.includes('Failed to fetch')) {
                    showAPIStatus('网络连接失败，请检查API地址或网络连接', 'error');
                } else {
                    showAPIStatus(`API调用失败: ${error.message}`, 'error');
                }
                
                return null;
            }
        }

        // =========================================================================
        // 要改：AI帮答功能
        // 作用：根据当前输入生成回复建议
        // 使用场景：点击灯泡图标
        // 说明：调用API生成2个简短的回复建议，用户点击后可快速填入输入框
        // =========================================================================

        /** 获取AI帮答建议 */
        async function getAIHelpSuggestions() {
            if (!state.currentContact) return;
            
            const currentInput = elements.messageInput.value.trim();
            if (!currentInput) return;
            
            // 检查API配置
            if (!state.apiConfig.url || !state.apiConfig.key) {
                showAPIStatus('请先配置API设置', 'error');
                return;
            }
            
            
            // 构建提示词
            const helpPrompt = state.appSettings.aiHelpPrompt;
            const contactInstruction = state.currentContact.roleInstruction;
            
            // 构建消息历史
            const messages = [
                {
                    role: 'system',
                    content: contactInstruction + '\n\n' + helpPrompt
                }
            ];
            
            // 添加上下文
            const contactId = state.currentContact.id;
            const history = state.messages[contactId] || [];
            const maxContext = Math.min(parseInt(state.appSettings.maxContextLength) || 5, 5);
            const recentHistory = history.slice(-maxContext);
            
            recentHistory.forEach(msg => {
                messages.push({
                    role: msg.isUser ? 'user' : 'assistant',
                    content: msg.content
                });
            });
            
            // 添加当前输入
            messages.push({
                role: 'user',
                content: `用户当前的输入是："${currentInput}"。请基于此生成回复建议。`
            });
            
            try {
                const response = await fetch(state.apiConfig.url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.apiConfig.key}`
                    },
                    body: JSON.stringify({
                        model: state.apiConfig.model,
                        messages: messages,
                        //temperature: 0.7,
                        max_tokens: 200
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status}`);
                }
                
                const data = await response.json();
                const suggestionsText = data.choices?.[0]?.message?.content || '';
                
                // 解析建议文本
                const suggestions = suggestionsText.split('\n')
                    .map(s => s.trim().replace(/^\d+[\.\)]?\s*/, ''))
                    .filter(s => s.length > 5 && s.length < 50)
                    .slice(0, 5);
                
                if (suggestions.length > 0) {
                    showAISuggestions(suggestions);
                }
                
            } catch (error) {
                console.error('获取AI建议失败:', error);
            }
        }

        /** 显示AI建议 */
        function showAISuggestions(suggestions) {
            elements.aiSuggestions.innerHTML = '';
            
            suggestions.forEach(suggestion => {
                const div = document.createElement('div');
                div.className = 'suggestion';
                div.textContent = suggestion;
                div.addEventListener('click', function() {
                    elements.messageInput.value = this.textContent;
                    autoResizeTextarea();
                    elements.aiSuggestions.classList.remove('active');
                    elements.messageInput.focus();
                });
                elements.aiSuggestions.appendChild(div);
            });
            
            elements.aiSuggestions.classList.add('active');
        }

         // 获取可用模型
         async function getAvailableModels() {
            // 直接读取输入框的值
            const apiUrl = elements.apiUrl.value.trim();
            const apiKey = elements.apiKey.value.trim();

            if (!apiUrl || !apiKey) {
                showAPIStatus('请先填写API地址和密钥', 'error');
                return;
            }
            
            try {
                showAPIStatus('正在获取模型列表...', 'success');
                
                // 构建模型列表URL
                let modelsUrl = apiUrl;
                
                // 如果URL包含/chat/completions，替换为/models
                if (modelsUrl.includes('/chat/completions')) {
                    modelsUrl = modelsUrl.replace('/chat/completions', '/models');
                } else {
                    // 否则直接在末尾加上/models
                    modelsUrl = modelsUrl.replace(/\/+$/, '') + '/models';
                }
                
                console.log('尝试获取模型的URL:', modelsUrl);
                
                const response = await fetch(modelsUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,// 使用输入框的值
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    // 如果获取模型列表失败，提示用户手动输入
                    throw new Error('该API提供商可能不支持获取模型列表，请手动输入模型名称');
                }
                
                const data = await response.json();
                const models = data.data || [];
                
                if (models.length === 0) {
                    showAPIStatus('未获取到可用模型，请手动输入', 'error');
                    return;
                }
                
                // 更新模型选择器
                elements.modelSelect.innerHTML = '<option value="">选择模型</option>';
                models.forEach(model => {
                    if (model.id) {
                        const option = document.createElement('option');
                        option.value = model.id;
                        option.textContent = model.id;
                        elements.modelSelect.appendChild(option);
                    }
                });
                
                elements.modelSelect.style.display = 'block';
                state.apiConfig.availableModels = models.map(m => m.id);
                showAPIStatus(`获取到 ${models.length} 个模型`, 'success');
                
            } catch (error) {
                console.error('获取模型失败:', error);
                showAPIStatus(`获取模型失败: ${error.message}`, 'error');
            }
        }

        /** 设置搜索功能的事件监听 */
        function setupSearch() {
            // 对话设置按钮点击事件
            elements.chatSettingsBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                
                const isSearchVisible = elements.searchContainer.style.display === 'flex';
                
                if (isSearchVisible) {
                    elements.searchContainer.style.display = 'none';
                } else {
                    elements.searchContainer.style.display = 'flex';
                    elements.searchInput.focus();
                }
            });
            
            // 搜索输入事件
            elements.searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                if (searchTerm && state.currentContact) {
                    const contactId = state.currentContact.id;
                    const messages = state.messages[contactId] || [];
                    
                    // 查找匹配的消息
                    state.searchResults = [];
                    messages.forEach(msg => {
                        if (msg.content.toLowerCase().includes(searchTerm)) {
                            state.searchResults.push(msg);
                        }
                    });
                    
                    // 显示搜索结果
                    if (state.searchResults.length > 0) {
                        elements.searchResults.classList.add('active');
                        elements.searchCount.textContent = `找到 ${state.searchResults.length} 个结果`;
                        state.currentSearchIndex = 0;
                        highlightCurrentSearchResult();
                        
                        // 更新导航按钮状态
                        elements.prevResult.disabled = true;
                        elements.nextResult.disabled = state.searchResults.length <= 1;
                    } else {
                        elements.searchResults.classList.remove('active');
                        state.currentSearchIndex = -1;
                    }
                } else {
                    closeSearch();
                }
            });
            
            // 取消搜索按钮
            elements.searchCancelBtn.addEventListener('click', function() {
                closeSearch();
            });
            
            // 上一个结果按钮
            elements.prevResult.addEventListener('click', function() {
                if (state.currentSearchIndex > 0) {
                    state.currentSearchIndex--;
                    highlightCurrentSearchResult();
                    
                    elements.nextResult.disabled = false;
                    if (state.currentSearchIndex === 0) {
                        elements.prevResult.disabled = true;
                    }
                }
            });
            
            // 下一个结果按钮
            elements.nextResult.addEventListener('click', function() {
                if (state.currentSearchIndex < state.searchResults.length - 1) {
                    state.currentSearchIndex++;
                    highlightCurrentSearchResult();
                    
                    elements.prevResult.disabled = false;
                    if (state.currentSearchIndex === state.searchResults.length - 1) {
                        elements.nextResult.disabled = true;
                    }
                }
            });
            
            // 点击页面其他地方关闭搜索
            document.addEventListener('click', function(e) {
                if (!elements.searchContainer.contains(e.target) && 
                    !elements.chatSettingsBtn.contains(e.target) &&
                    !elements.searchResults.contains(e.target)) {
                    closeSearch();
                }
            });
            
            // 阻止搜索容器内的点击事件冒泡
            elements.searchContainer.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
        
        /** 高亮当前搜索结果 */
        function highlightCurrentSearchResult() {
            // 清除之前的高亮
            document.querySelectorAll('.message').forEach(msg => {
                msg.classList.remove('highlight');
            });
            
            // 高亮当前匹配项
            if (state.currentSearchIndex >= 0 && state.currentSearchIndex < state.searchResults.length) {
                const result = state.searchResults[state.currentSearchIndex];
                const messageElement = document.querySelector(`.message[data-id="${result.id}"]`);
                if (messageElement) {
                    messageElement.classList.add('highlight');
                    messageElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }
        
        /** 关闭搜索 */
        function closeSearch() {
            elements.searchContainer.style.display = 'none';
            elements.searchResults.classList.remove('active');
            elements.searchInput.value = '';
            state.searchResults = [];
            state.currentSearchIndex = -1;
            
            // 清除高亮
            document.querySelectorAll('.message').forEach(msg => {
                msg.classList.remove('highlight');
            });
        }

                    if (value && !value.includes('/chat/completions')) {
                        value = value.replace(/\/+$/, '');
                        elements.apiUrl.value = value + '/chat/completions';
                        console.log('自动补全为:', elements.apiUrl.value);
                    }
                });
            }

            // 保存其他设置
            elements.maxContextLength.addEventListener('change', saveAppSettings);
            elements.aiHelpPrompt.addEventListener('change', saveAppSettings);
            
            // 创建聊天模态框事件
            elements.addContactBtn.addEventListener('click', () => {
                goToStep(1);
                elements.createChatModal.style.display = 'flex';
            });
            
            elements.closeCreateChatModal.addEventListener('click', () => {
                elements.createChatModal.style.display = 'none';
            });
            
            elements.cancelCreateBtn.addEventListener('click', () => {
                elements.createChatModal.style.display = 'none';
            });
            
            elements.nextStepBtn.addEventListener('click', () => {
                const windowName = elements.windowName.value.trim();
                if (!windowName) {
                    showAPIStatus('请填写窗口名称', 'error');
                    return;
                }
                goToStep(2);
            });
            
            elements.prevStepBtn.addEventListener('click', () => {
                goToStep(1);
            });
            
            elements.createChatBtn.addEventListener('click', createChat);
            
            // 确认删除模态框事件
            elements.cancelDeleteBtn.addEventListener('click', hideConfirmDeleteModal);
            elements.confirmDeleteBtn.addEventListener('click', deleteContact);
            
            // 点击模态框外部关闭
            window.addEventListener('click', (e) => {
                if (e.target === elements.createChatModal) {
                    elements.createChatModal.style.display = 'none';
                }
                if (e.target === elements.confirmDeleteModal) {
                    hideConfirmDeleteModal();
                }
            });
            
            // 设置功能
            setupSearch();
            
            // 设置聊天菜单功能
            setupChatSettingsMenu();
            
            // 保存聊天模态框事件
            elements.closeSaveChatModal.addEventListener('click', () => {
                elements.saveChatModal.style.display = 'none';
            });
            
            elements.cancelSaveChatBtn.addEventListener('click', () => {
                elements.saveChatModal.style.display = 'none';
            });
            
            elements.selectAllMessagesBtn.addEventListener('click', toggleSelectAll);
            
            elements.confirmSaveChatBtn.addEventListener('click', saveSelectedMessagesAsImage);
            
            // 点击模态框外部关闭
            window.addEventListener('click', (e) => {
                if (e.target === elements.saveChatModal) {
                    elements.saveChatModal.style.display = 'none';
                }
            });
            
            // 设置保存模态框搜索功能
            setupSaveModalSearch();
        }

        // =========================================================================
        // 保存聊天记录功能相关函数（在 init 函数外部定义）
        // =========================================================================

        /** 打开保存聊天记录模态框 */
        function openSaveChatModal() {
            if (!state.currentContact) return;
            
            const messages = state.messages[state.currentContact.id] || [];
            if (messages.length === 0) {
                alert('当前没有聊天记录可保存');
                return;
            }
            
            // 清空之前的选择
            state.selectedMessages.clear();
            state.isAllSelected = false;
            
            // 重置搜索状态
            state.saveSearchResults = [];
            state.saveCurrentSearchIndex = -1;
            state.originalMessages = [];
            
            // 渲染消息列表
            renderSaveMessageList(messages);
            
            // 显示模态框
            elements.saveChatModal.style.display = 'flex';
            
            // 隐藏搜索结果导航栏（初始状态）
            const saveSearchResults = document.getElementById('saveSearchResults');
            if (saveSearchResults) {
                saveSearchResults.classList.remove('active');
            }
            
            // 清空搜索输入框
            const saveSearchInput = document.getElementById('saveSearchInput');
            if (saveSearchInput) {
                saveSearchInput.value = '';
            }
            
            // 更新计数
            updateSelectedCount();
        }

        // =========================================================================
        // 保存模态框搜索功能（修改为与聊天窗口相同的定位功能）
        // 作用：在保存聊天记录模态框中搜索消息，定位到对应消息气泡并高亮
        // 使用场景：用户在保存模态框中搜索特定消息时
        // 说明：不过滤消息列表，只高亮匹配的消息并支持上下导航
        // =========================================================================

        /** 设置保存模态框搜索功能的事件监听 */
        function setupSaveModalSearch() {
            const saveSearchInput = document.getElementById('saveSearchInput');
            const saveSearchCancelBtn = document.getElementById('saveSearchCancelBtn');
            const saveSearchResults = document.getElementById('saveSearchResults');
            const saveSearchCount = document.getElementById('saveSearchCount');
            const savePrevResult = document.getElementById('savePrevResult');
            const saveNextResult = document.getElementById('saveNextResult');
            
            if (!saveSearchInput) return;
            
            // 搜索输入事件
            saveSearchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase().trim();
                
                if (searchTerm && state.currentContact) {
                    const contactId = state.currentContact.id;
                    const messages = state.messages[contactId] || [];
                    
                    // =========================================================================
                    // 修改：不再过滤消息列表，而是记录匹配的消息索引用于导航
                    // 作用：保持显示所有消息，只高亮匹配的项
                    // =========================================================================
                    state.saveSearchResults = [];
                    messages.forEach(msg => {
                        if (msg.content.toLowerCase().includes(searchTerm)) {
                            state.saveSearchResults.push(msg);
                        }
                    });
                    
                    // 显示搜索结果导航
                    if (state.saveSearchResults.length > 0) {
                        saveSearchResults.classList.add('active');
                        saveSearchCount.textContent = `找到 ${state.saveSearchResults.length} 个结果`;
                        state.saveCurrentSearchIndex = 0;
                        highlightSaveSearchResult();
                        
                        // 更新导航按钮状态
                        savePrevResult.disabled = true;
                        saveNextResult.disabled = state.saveSearchResults.length <= 1;
                    } else {
                        saveSearchResults.classList.remove('active');
                        state.saveCurrentSearchIndex = -1;
                        state.saveSearchResults = [];
                        
                        // 清除所有高亮
                        document.querySelectorAll('.save-message-wrapper').forEach(wrapper => {
                            wrapper.classList.remove('highlight');
                        });
                    }
                } else {
                    // 搜索词为空，关闭搜索
                    closeSaveModalSearch();
                }
            });
            
            // 取消搜索按钮
            saveSearchCancelBtn.addEventListener('click', function() {
                closeSaveModalSearch();
                saveSearchInput.value = ''; // 清空输入框
            });
            
            // 上一个结果按钮
            savePrevResult.addEventListener('click', function() {
                if (state.saveCurrentSearchIndex > 0) {
                    state.saveCurrentSearchIndex--;
                    highlightSaveSearchResult();
                    
                    saveNextResult.disabled = false;
                    savePrevResult.disabled = state.saveCurrentSearchIndex === 0;
                }
            });
            
            // 下一个结果按钮
            saveNextResult.addEventListener('click', function() {
                if (state.saveCurrentSearchIndex < state.saveSearchResults.length - 1) {
                    state.saveCurrentSearchIndex++;
                    highlightSaveSearchResult();
                    
                    savePrevResult.disabled = false;
                    saveNextResult.disabled = state.saveCurrentSearchIndex === state.saveSearchResults.length - 1;
                }
            });
        }

        /** 高亮保存模态框中的当前搜索结果 */
        function highlightSaveSearchResult() {
            // 清除之前的高亮
            document.querySelectorAll('.save-message-wrapper').forEach(wrapper => {
                wrapper.classList.remove('highlight');
            });
            
            // 高亮当前匹配项
            if (state.saveCurrentSearchIndex >= 0 && state.saveCurrentSearchIndex < state.saveSearchResults.length) {
                const result = state.saveSearchResults[state.saveCurrentSearchIndex];
                const messageElement = document.querySelector(`.save-message-wrapper[data-id="${result.id}"]`);
                if (messageElement) {
                    messageElement.classList.add('highlight');
                    
                    // =========================================================================
                    // 滚动到高亮消息位置
                    // 作用：让用户自动看到当前搜索到的消息
                    // =========================================================================
                    messageElement.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'center' 
                    });
                    
                    // 更新搜索结果计数显示（显示当前是第几个）
                    const saveSearchCount = document.getElementById('saveSearchCount');
                    if (saveSearchCount) {
                        saveSearchCount.textContent = `找到 ${state.saveSearchResults.length} 个结果 (${state.saveCurrentSearchIndex + 1}/${state.saveSearchResults.length})`;
                    }
                }
            }
        }

        /** 关闭保存模态框搜索 */
        function closeSaveModalSearch() {
            const saveSearchResults = document.getElementById('saveSearchResults');
            const saveSearchInput = document.getElementById('saveSearchInput');
            
            if (saveSearchResults) {
                saveSearchResults.classList.remove('active');
            }
            
            if (saveSearchInput) {
                saveSearchInput.value = '';
            }
            
            state.saveSearchResults = [];
            state.saveCurrentSearchIndex = -1;
            
            // 清除高亮
            document.querySelectorAll('.save-message-wrapper').forEach(wrapper => {
                wrapper.classList.remove('highlight');
            });
        }

        /** 打开保存聊天记录模态框（需要修改，移除filterMessagesBySearch调用） */
        function openSaveChatModal() {
            if (!state.currentContact) return;
            
            const messages = state.messages[state.currentContact.id] || [];
            if (messages.length === 0) {
                alert('当前没有聊天记录可保存');
                return;
            }
            
            // 清空之前的选择
            state.selectedMessages.clear();
            state.isAllSelected = false;
            
            // 重置搜索状态
            state.saveSearchResults = [];
            state.saveCurrentSearchIndex = -1;
            state.originalMessages = [];
            
            // 渲染消息列表（显示所有消息）
            renderSaveMessageList(messages);
            
            // 显示模态框
            elements.saveChatModal.style.display = 'flex';
            
            // 隐藏搜索结果导航栏（初始状态）
            const saveSearchResults = document.getElementById('saveSearchResults');
            if (saveSearchResults) {
                saveSearchResults.classList.remove('active');
            }
            
            // 清空搜索输入框
            const saveSearchInput = document.getElementById('saveSearchInput');
            if (saveSearchInput) {
                saveSearchInput.value = '';
            }
            
            // 更新计数
            updateSelectedCount();
        }

        /** 渲染保存消息列表 - 不需要修改，保持显示所有消息 */
        function renderSaveMessageList(messages) {
            elements.saveMessageList.innerHTML = '';
            
            messages.forEach((msg, index) => {
                // 创建消息包装器，用于处理选中状态和点击事件
                const wrapper = document.createElement('div');
                wrapper.className = `save-message-wrapper ${msg.isUser ? 'user-message' : 'ai-message'} ${state.selectedMessages.has(msg.id) ? 'selected' : ''}`;
                wrapper.dataset.id = msg.id;
                wrapper.dataset.index = index;
                
                // 创建消息气泡 - 完全复用聊天窗口的样式
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.isUser ? 'user' : 'ai'}`;
                
                // 只显示消息内容，不显示时间
                messageDiv.innerHTML = `<div class="message-content">${msg.content}</div>`;
                
                // 组装
                wrapper.appendChild(messageDiv);
                
                // 点击包装器切换选中状态
                wrapper.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleSelectMessage(msg.id);
                });
                
                elements.saveMessageList.appendChild(wrapper);
            });
            
            // 更新全选按钮状态
            updateSelectAllButton();
        }

        /** 切换消息选中状态 **/
        function toggleSelectMessage(messageId) {
            if (state.selectedMessages.has(messageId)) {
                state.selectedMessages.delete(messageId);
            } else {
                state.selectedMessages.add(messageId);
            }
            
            // 更新包装器样式
            const wrapper = elements.saveMessageList.querySelector(`[data-id="${messageId}"]`);
            if (wrapper) {
                wrapper.classList.toggle('selected', state.selectedMessages.has(messageId));
            }
            
            // 更新全选状态和计数
            state.isAllSelected = false;
            updateSelectAllButton();
            updateSelectedCount();
        }

        /** 全选/取消全选 **/
        function toggleSelectAll() {
            const messages = state.messages[state.currentContact.id] || [];
            
            if (state.isAllSelected) {
                // 取消全选
                state.selectedMessages.clear();
                state.isAllSelected = false;
            } else {
                // 全选
                messages.forEach(msg => state.selectedMessages.add(msg.id));
                state.isAllSelected = true;
            }
            
            // 重新渲染消息列表
            renderSaveMessageList(messages);
            
            // 更新按钮文字和计数
            updateSelectAllButton();
            updateSelectedCount();
        }

        /** 更新全选按钮文字 */
        function updateSelectAllButton() {
            if (elements.selectAllMessagesBtn) {
                elements.selectAllMessagesBtn.textContent = state.isAllSelected ? '取消全选' : '全选';
            }
        }

        /** 更新已选数量显示 */
        function updateSelectedCount() {
            if (elements.selectedMessagesCount) {
                elements.selectedMessagesCount.textContent = `已选择 ${state.selectedMessages.size} 条`;
            }
        }

        /** 保存选中的消息为图片 */
        async function saveSelectedMessagesAsImage() {
            if (state.selectedMessages.size === 0) {
                alert('请至少选择一条消息');
                return;
            }
            
            // 创建临时容器来渲染选中的消息
            const tempContainer = document.createElement('div');
            tempContainer.style.cssText = `
                position: fixed;
                top: -9999px;
                left: -9999px;
                background: var(--bg-primary);
                padding: 20px;
                border-radius: 15px;
                max-width: 380px;
            `;
            
            // 获取选中的消息并按时间排序
            const messages = state.messages[state.currentContact.id] || [];
            const selectedMessages = messages
                .filter(msg => state.selectedMessages.has(msg.id))
                .sort((a, b) => a.id - b.id);  // 按时间正序
            
            // 渲染选中的消息 - 不显示时间
            selectedMessages.forEach(msg => {
                const msgDiv = document.createElement('div');

                // 设置消息样式
                const isUser = msg.isUser;
                msgDiv.style.cssText = `
                    max-width: 85%;
                    padding: 12px 16px;
                    border-radius: 18px;
                    font-size: 14px;
                    line-height: 1.4;
                    word-wrap: break-word;
                    margin-bottom: 10px;
                    ${isUser ? `
                        margin-left: auto;
                        background: #38b2ac;
                        color: white;
                        border-bottom-right-radius: 6px;
                    ` : `
                        margin-right: auto;
                        background: #2d3748;
                        color: #e2e8f0;
                        border: 1px solid #2d3748;
                        border-bottom-left-radius: 6px;
                    `}
                `;
                
                // 只显示消息内容，不显示时间
                msgDiv.textContent = msg.content;
                
                tempContainer.appendChild(msgDiv);
            });
            
            // 添加到body
            document.body.appendChild(tempContainer);
            
            try {
                // 使用html2canvas截图
                const canvas = await html2canvas(tempContainer, {
                    scale: 2,
                    backgroundColor: '#1a1f2c',
                    logging: false,
                    allowTaint: false,
                    useCORS: true
                });
                
                // 创建下载链接
                const link = document.createElement('a');
                link.download = `Echo_Garden_${new Date().toLocaleDateString()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // 关闭模态框
                elements.saveChatModal.style.display = 'none';
                
            } catch (error) {
                console.error('保存图片失败:', error);
                alert('保存失败，请重试');
            } finally {
                // 移除临时容器
                document.body.removeChild(tempContainer);
            }
        }

        // =========================================================================
        // 修改原有的setupSearch函数，移除原有的聊天设置按钮点击事件
        // 新功能：点击设置按钮显示菜单，而不是直接显示搜索
        // =========================================================================
        function setupChatSettingsMenu() {
            // 点击设置按钮显示/隐藏菜单
            elements.chatSettingsBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                
                const menu = elements.chatSettingsMenu;
                const isVisible = menu.style.display === 'block';
                
                if (isVisible) {
                    menu.style.display = 'none';
                } else {
                    menu.style.display = 'block';
                }
            });
            
            // 点击菜单中的"搜索聊天记录"
            elements.menuSearchBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                
                // 隐藏菜单
                elements.chatSettingsMenu.style.display = 'none';
                
                // 显示搜索栏（原功能）
                elements.searchContainer.style.display = 'flex';
                elements.searchInput.focus();
            });
            
            // 点击菜单中的"保存聊天记录"
            elements.menuSaveChatBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                
                // 隐藏菜单
                elements.chatSettingsMenu.style.display = 'none';
                
                // 打开保存聊天记录模态框
                openSaveChatModal();
            });
            
            // 点击其他地方关闭菜单
            document.addEventListener('click', function(e) {
                if (!elements.chatSettingsBtn.contains(e.target) && 
                    !elements.chatSettingsMenu.contains(e.target)) {
                    elements.chatSettingsMenu.style.display = 'none';
                }
            });
            
            // 阻止菜单内的点击事件冒泡
            elements.chatSettingsMenu.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }

        // =========================================================================
        // 修改原有的setupSearch函数，移除其中原有的聊天设置按钮事件
        // =========================================================================
        function setupSearch() {
            // 移除原有的chatSettingsBtn事件监听，因为已经在setupChatSettingsMenu中处理
            
            // 搜索输入事件（保持不变）
            elements.searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                if (searchTerm && state.currentContact) {
                    const contactId = state.currentContact.id;
                    const messages = state.messages[contactId] || [];
                    
                    // 查找匹配的消息
                    state.searchResults = [];
                    messages.forEach(msg => {
                        if (msg.content.toLowerCase().includes(searchTerm)) {
                            state.searchResults.push(msg);
                        }
                    });
                    
                    // 显示搜索结果
                    if (state.searchResults.length > 0) {
                        elements.searchResults.classList.add('active');
                        elements.searchCount.textContent = `找到 ${state.searchResults.length} 个结果`;
                        state.currentSearchIndex = 0;
                        highlightCurrentSearchResult();
                        
                        // 更新导航按钮状态
                        elements.prevResult.disabled = true;
                        elements.nextResult.disabled = state.searchResults.length <= 1;
                    } else {
                        elements.searchResults.classList.remove('active');
                        state.currentSearchIndex = -1;
                    }
                } else {
                    closeSearch();
                }
            });
            
            // 取消搜索按钮（保持不变）
            elements.searchCancelBtn.addEventListener('click', function() {
                closeSearch();
            });
            
            // 上一个结果按钮（保持不变）
            elements.prevResult.addEventListener('click', function() {
                if (state.currentSearchIndex > 0) {
                    state.currentSearchIndex--;
                    highlightCurrentSearchResult();
                    
                    elements.nextResult.disabled = false;
                    if (state.currentSearchIndex === 0) {
                        elements.prevResult.disabled = true;
                    }
                }
            });
            
            // 下一个结果按钮（保持不变）
            elements.nextResult.addEventListener('click', function() {
                if (state.currentSearchIndex < state.searchResults.length - 1) {
                    state.currentSearchIndex++;
                    highlightCurrentSearchResult();
                    
                    elements.prevResult.disabled = false;
                    if (state.currentSearchIndex === state.searchResults.length - 1) {
                        elements.nextResult.disabled = true;
                    }
                }
            });
            
            // 点击页面其他地方关闭搜索（保持不变）
            document.addEventListener('click', function(e) {
                if (!elements.searchContainer.contains(e.target) && 
                    !elements.chatSettingsBtn.contains(e.target) &&
                    !elements.searchResults.contains(e.target)) {
                    closeSearch();
                }
            });
            
            // 阻止搜索容器内的点击事件冒泡（保持不变）
            elements.searchContainer.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
