<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回声庭院 - 许你归去来兮</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 添加html2canvas库 - 用于生成长图 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* =========================================================================
         * 全局样式与变量定义
         * 作用：定义整个应用的颜色主题、基础布局和通用样式
         * 使用场景：所有页面共享的样式规则
         * ========================================================================= */
        
        /* 基础重置 - 移除所有元素的默认边距和内边距 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 颜色变量 - 统一管理主题色，方便后续修改主题 */
        :root {
            --bg-primary: #1a1f2c;      /* 主背景色 - 深蓝灰色 */
            --bg-secondary: #252a38;     /* 次要背景色 - 稍浅的蓝灰色 */
            --bg-card: #2d3748;           /* 卡片背景色 - 用于消息气泡、输入框等 */
            --accent-primary: #38b2ac;    /* 主色调 - 青绿色，用于重要按钮和选中状态 */
            --accent-secondary: #ed8936;   /* 辅助色调 - 橙色，用于灯泡图标等 */
            --accent-glow: #4fd1c7;        /* 高亮色 - 更亮的青绿色，用于悬停效果 */
            --text-primary: #e2e8f0;       /* 主要文字颜色 - 浅灰色 */
            --text-secondary: #94a3b8;     /* 次要文字颜色 - 中灰色 */
            --text-muted: #718096;          /* 浅色文字 - 深灰色，用于提示文字 */
            --border-color: #2d3748;        /* 边框颜色 - 与卡片背景色相同 */
            --shadow-color: rgba(26, 31, 44, 0.8);
            --danger-color: #ff3b30;        /* 危险颜色 - 红色，用于删除操作 */
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            /* 背景渐变 - 营造庭院氛围 */
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(56, 178, 172, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(237, 137, 54, 0.05) 0%, transparent 50%);
        }

        /* =========================================================================
         * 移动端主容器
         * 作用：模拟手机屏幕，限制最大宽度，创建全屏应用体验
         * 使用场景：整个应用的根容器
         * ========================================================================= */
        .app-container {
            max-width: 400px;            /* 限制最大宽度，模拟手机屏幕 */
            height: 100vh;                /* 固定高度，占满整个视口 */
            min-height: 100vh;            /* 备用高度 */
            margin: 0 auto;               /* 水平居中 */
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;              /* 隐藏溢出内容 */
            display: flex;
            flex-direction: column;        /* 垂直布局 */
        }

        /* =========================================================================
         * 状态栏样式
         * 作用：显示应用名称和当前时间
         * 使用场景：每个页面的顶部
         * ========================================================================= */
        /* .status-bar {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-primary);
            flex-shrink: 0;               //防止被压缩 
            border-bottom: 1px solid var(--border-color);
        }  */

        .app-name {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 1px;
            color: var(--accent-primary);
        }

        .time {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* =========================================================================
         * 联系人标题栏
         * 作用：显示"对话"标题和添加按钮
         * 使用场景：联系人列表页面顶部
         * ========================================================================= */
        .contacts-header {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .contacts-title {
            font-size: 18px;
            font-weight: 500;
        }

        .add-contact-btn {
            background: var(--accent-primary);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-contact-btn:hover {
            background: var(--accent-glow);
            transform: scale(1.1);
        }

        /* =========================================================================
         * 聊天头部样式
         * 作用：显示返回按钮、聊天标题和设置按钮
         * 使用场景：聊天页面顶部
         * ========================================================================= */
        .chat-header {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 500;
        }

        .chat-settings-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }

        /* =========================================================================
         * 聊天视图容器
         * 作用：包含消息列表和输入框的容器
         * 使用场景：聊天页面主体
         * ========================================================================= */
        .chat-view-container {
            position: relative;
            height: calc(100vh - 140px);   /* 减去顶部栏和输入框高度 */
            display: flex;
            flex-direction: column;
        }

        /* =========================================================================
         * 聊天消息容器
         * 作用：显示所有聊天消息的区域，支持滚动
         * 使用场景：聊天页面显示消息的部分
         * ========================================================================= */
        .chat-messages-container {
            flex: 1;
            overflow-y: auto;               /* 垂直滚动 */
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;                      /* 消息之间的间距 */
            padding-bottom: 90px;            /* 为输入框留出空间 */
        }

        /* =========================================================================
         * 消息气泡样式
         * 作用：定义用户和AI消息的不同样式
         * 使用场景：聊天中的每条消息
         * ========================================================================= */
        .message {
            max-width: 85%;                  /* 消息最大宽度，避免太宽 */
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            transition: all 0.3s ease;
            word-wrap: break-word;            /* 长单词换行 */
            overflow-wrap: break-word;
            animation: fadeIn 0.3s ease;      /* 淡入动画 */
        }

        .message.user {
            align-self: flex-end;              /* 用户消息靠右 */
            background: var(--accent-primary);
            color: white;
            border-bottom-right-radius: 6px;   /* 右下角小圆角，形成气泡效果 */
        }

        .message.ai {
            align-self: flex-start;             /* AI消息靠左 */
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 6px;     /* 左下角小圆角 */
        }

        .message.highlight {
            background-color: rgba(56, 178, 172, 0.3);
            border: 1px solid var(--accent-primary);
            box-shadow: 0 0 10px rgba(56, 178, 172, 0.5);
        }

        .welcome-message {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-style: italic;
            font-size: 13px;
        }

        /* =========================================================================
        * 消息时间样式
        * 作用：显示在AI消息左下角的时间
        * AI消息：时间显示在左下角
        * 用户消息：时间显示在右下角
        * 使用场景：AI消息中显示发送时间
        * ========================================================================= */
        .message-time {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            text-align: left;
            opacity: 0.8;
        }

        /* AI消息时间 - 左对齐 */
        .message.ai .message-time {
            text-align: left;
        }

        /* 用户消息时间 - 右对齐 */
        .message.user .message-time {
            text-align: right;
        }
        /* =========================================================================
         * 聊天设置菜单样式
         * 作用：美化聊天设置菜单的显示效果
         * 使用场景：点击聊天设置按钮时显示
         * ========================================================================= */
         .chat-settings-menu {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.2s ease;
        }

        .chat-settings-menu .menu-item:hover {
            background: var(--bg-card);
        }

                /* =========================================================================
         * 保存聊天记录模态框中的消息项样式
         * 作用：完全复用聊天窗口的消息气泡样式，支持点击选中
         * 使用场景：在保存聊天记录的模态框中显示可选的聊天消息
         * ========================================================================= */
         .save-messages-list {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--bg-primary);
            border-radius: 12px;
        }

        .save-message-wrapper {
            position: relative;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .save-message-wrapper.selected .message {
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 15px rgba(56, 178, 172, 0.3);
            transform: scale(1.02);
        }

        .save-message-wrapper.selected .message.user {
            border: 2px solid white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .save-message-wrapper .message {
            max-width: 100%;  /* 在模态框中允许更宽 */
            margin-bottom: 0;
            transition: all 0.2s ease;
            pointer-events: none;  /* 让点击事件穿透到wrapper */
        }

        .save-message-checkbox {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;  /* 让点击事件穿透到wrapper */
        }

        .save-message-wrapper.user-message .save-message-checkbox {
            right: -10px;  /* 用户消息的复选框放在右侧 */
        }

        .save-message-wrapper.ai-message .save-message-checkbox {
            left: -10px;  /* AI消息的复选框放在左侧 */
        }

        .save-message-wrapper:hover .save-message-checkbox {
            opacity: 0.5;
        }

        .save-message-wrapper.selected .save-message-checkbox {
            opacity: 1;
            background: var(--accent-primary);
        }

        .save-message-wrapper.selected .save-message-checkbox i {
            display: block;
        }

        .save-message-wrapper .message-content {
            word-break: break-word;
        }

        /* =========================================================================
         * 聊天设置菜单样式
         * 作用：美化聊天设置菜单的显示效果
         * 使用场景：点击聊天设置按钮时显示
         * ========================================================================= */
         .chat-settings-menu {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.2s ease;
        }

        .chat-settings-menu .menu-item:hover {
            background: var(--bg-card);
        }

        /* =========================================================================
         * 保存聊天记录模态框中的消息项样式
         * 作用：完全复用聊天窗口的消息气泡样式，支持点击选中
         * 使用场景：在保存聊天记录的模态框中显示可选的聊天消息
         * ========================================================================= */
         .save-messages-list {
            flex: 1;
            overflow-y: auto;
            margin: 15px 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--bg-primary);
            border-radius: 12px;
        }

        .save-message-wrapper {
            position: relative;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .save-message-wrapper.selected .message {
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 15px rgba(56, 178, 172, 0.3);
            transform: scale(1.02);
        }

        .save-message-wrapper.selected .message.user {
            border: 2px solid white;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .save-message-wrapper .message {
            max-width: 100%;  /* 在模态框中允许更宽 */
            margin-bottom: 0;
            transition: all 0.2s ease;
            pointer-events: none;  /* 让点击事件穿透到wrapper */
        }

        .save-message-wrapper .message-content {
            word-break: break-word;
        }

        /* =========================================================================
         * 输入区域样式
         * 作用：固定在底部的消息输入框和发送按钮
         * 使用场景：聊天页面底部
         * ========================================================================= */
        .chat-input-section {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: end;                /* 底部对齐 */
        }

        .message-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 12px 18px;
            color: var(--text-primary);
            font-size: 14px;
            resize: none;                    /* 禁止手动调整大小 */
            max-height: 120px;
            min-height: 44px;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(56, 178, 172, 0.2);
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .lightbulb {
            background: var(--accent-secondary);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 20px;
        }
        
        .lightbulb:hover {
            transform: scale(1.1);
        }

        .send-button {
            background: var(--accent-primary);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .send-button:hover {
            background: var(--accent-glow);
            transform: scale(1.05);
        }

        /* =========================================================================
         * AI建议区域样式
         * 作用：显示AI生成的回复建议
         * 使用场景：点击灯泡图标后
         * ========================================================================= */
        .ai-suggestions {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            padding-bottom: 5px;
        }

        .ai-suggestions.active {
            display: flex;                    /* 激活时显示 */
        }

        .suggestion {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;               /* 不换行 */
            transition: all 0.3s ease;
        }

        .suggestion:hover {
            background: var(--accent-primary);
            color: white;
        }

        /* =========================================================================
         * 底部导航样式
         * 作用：页面切换导航栏
         * 使用场景：联系人列表和设置页面底部
         * ========================================================================= */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 12px 15px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 11px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
        }

        .nav-item.active {
            color: var(--accent-primary);      /* 激活状态 */
        }

        .nav-item.highlight {
            color: var(--accent-secondary);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        /* =========================================================================
         * 滚动条样式
         * 作用：美化消息列表的滚动条
         * 使用场景：聊天消息区域
         * ========================================================================= */
        .chat-messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages-container::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .chat-messages-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        /* =========================================================================
         * 动画效果
         * 作用：消息出现时的淡入动画
         * 使用场景：新消息添加到DOM时
         * ========================================================================= */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* =========================================================================
         * 花园装饰元素
         * 作用：增加氛围感的背景装饰
         * 使用场景：所有页面背景
         * ========================================================================= */
        .decoration {
            position: absolute;
            font-size: 12px;
            opacity: 0.3;
            z-index: -1;
        }

        .decoration-1 { top: 15%; left: 10%; }
        .decoration-2 { top: 25%; right: 8%; }
        .decoration-3 { bottom: 30%; left: 5%; }

        /* =========================================================================
         * 搜索结果导航样式
         * 作用：显示搜索框和搜索结果导航
         * 使用场景：聊天页面点击设置按钮后
         * ========================================================================= */
        .search-container {
            padding: 10px 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: none;                    /* 默认隐藏 */
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 15px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .search-cancel-btn {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .search-results {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .search-results.active {
            display: flex;
        }
        
        .search-nav-btn {
            background: var(--accent-primary);
            border: none;
            border-radius: 15px;
            padding: 5px 10px;
            color: white;
            font-size: 11px;
            cursor: pointer;
        }
        
        .search-nav-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        /* =========================================================================
         * 模态框样式
         * 作用：创建聊天和删除确认的弹窗
         * 使用场景：点击添加按钮或删除时
         * ========================================================================= */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 500;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        /* =========================================================================
         * 表单样式
         * 作用：定义输入框、选择框等表单元素样式
         * 使用场景：设置页面和创建聊天模态框
         * ========================================================================= */
        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        /* =========================================================================
         * 联系人列表样式
         * 作用：显示所有聊天窗口的列表
         * 使用场景：联系人列表页面
         * ========================================================================= */
        .contact-list {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-bottom: 60px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .contact-item:hover {
            background: var(--bg-card);
        }

        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-preview {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================================================================
         * 滑动删除样式
         * 作用：支持左滑显示删除按钮
         * 使用场景：联系人列表中的每个项目
         * ========================================================================= */
        .contact-item-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .delete-action {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            background: var(--danger-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .contact-item.swiped .delete-action {
            transform: translateX(0);
        }

        .contact-item.swiped .contact-item-wrapper {
            transform: translateX(-80px);
        }

        /* =========================================================================
         * 设置页面样式
         * 作用：应用设置和API配置页面
         * 使用场景：点击底部导航"设置"
         * ========================================================================= */
        .settings-container {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px 15px 80px;
        }

        .settings-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-section:last-child {
            border-bottom: none;
        }

        .settings-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-title i {
            color: var(--accent-primary);
        }

        /* =========================================================================
         * API状态提示样式
         * 作用：显示API连接状态和错误信息
         * 使用场景：设置页面保存配置或测试连接时
         * ========================================================================= */
        .api-status {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
        }

        .api-status.success {
            background: rgba(56, 178, 172, 0.2);
            color: var(--accent-primary);
        }

        .api-status.error {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
        }

        /* =========================================================================
         * 步骤指示器样式
         * 作用：显示创建聊天窗口的步骤
         * 使用场景：创建聊天模态框
         * ========================================================================= */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .step {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .step.active {
            background: var(--accent-primary);
        }

        /* =========================================================================
         * 步骤容器
         * 作用：切换显示不同的步骤表单
         * 使用场景：创建聊天模态框
         * ========================================================================= */
        .step-container {
            display: none;
        }

        .step-container.active {
            display: block;
        }

        /* =========================================================================
         * 视图切换
         * 作用：控制不同页面的显示/隐藏
         * 使用场景：联系人列表、聊天、设置页面
         * ========================================================================= */
        .contacts-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-view {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-view.active {
            display: flex;
        }

        .settings-view {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .settings-view.active {
            display: flex;
        }

        /* =========================================================================
         * 消息操作菜单样式
         * 作用：右键点击消息时弹出的操作菜单
         * 使用场景：聊天页面右键点击消息
         * ========================================================================= */
        .message-menu {
            position: absolute;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            min-width: 120px;
            display: none;
        }

        .menu-item {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background: none;
            border: none;
            text-align: left;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            margin: 2px 0;
        }

        .menu-item:hover {
            background: var(--bg-card);
        }

        .menu-item i {
            margin-right: 8px;
            width: 16px;
        }

        /* =========================================================================
         * 确认删除模态框样式
         * 作用：删除联系人前的确认弹窗
         * 使用场景：滑动删除点击删除按钮后
         * ========================================================================= */
        .confirm-delete-modal {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 25px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }

        .confirm-delete-text {
            margin-bottom: 20px;
            font-size: 16px;
            color: var(--text-primary);
        }

        .confirm-delete-actions {
            display: flex;
            gap: 10px;
        }

        .confirm-delete-btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .confirm-delete-btn.cancel {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .confirm-delete-btn.delete {
            background: var(--danger-color);
            color: white;
        }

        .confirm-delete-btn.cancel:hover {
            background: var(--border-color);
        }

        .confirm-delete-btn.delete:hover {
            background: #ff1a1a;
        }

        /* =========================================================================
        * 保存模态框搜索样式
        * 作用：确保保存模态框中的搜索栏和搜索结果与主界面样式一致
        * ========================================================================= */
        #saveSearchContainer {
            display: flex;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        #saveSearchInput {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 15px;
            color: var(--text-primary);
            font-size: 14px;
        }

        #saveSearchInput:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        #saveSearchCancelBtn {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        #saveSearchResults {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
        }

        #saveSearchResults.active {
            display: flex;
        }

        .save-message-wrapper.highlight {
            border: 2px solid var(--accent-primary);
            box-shadow: 0 0 15px rgba(56, 178, 172, 0.5);
            transform: scale(1.02);
            transition: all 0.3s ease;
            z-index: 10;
            position: relative;
        }

        /* 确保高亮时复选框不影响显示 */
        .save-message-wrapper.highlight .message {
            border-color: var(--accent-primary);
        }        
    </style>
</head>
<body>
    <div class="app-container">
        <!-- =========================================================================
         * 联系人列表视图
         * 作用：显示所有聊天窗口的列表页面
         * 包含：状态栏、标题栏、联系人列表
         * ========================================================================= -->
        <div class="contacts-view" id="contactsView">
            <!-- 状态栏：显示应用名称和当前时间
            <div class="status-bar">
                <div class="app-name">回声庭院</div>
                <div class="time" id="currentTime">21:30</div>
            </div> -->

            <!-- 联系人标题栏：标题和添加按钮 -->
            <div class="contacts-header">
                <div class="contacts-title">对话</div>
                <button class="add-contact-btn" id="addContactBtn" title="新建对话">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <!-- 联系人列表：动态生成的联系人项目 -->
            <div class="contact-list" id="contactList">
                <!-- 联系人将动态添加到这里 -->
            </div>
        </div>

        <!-- =========================================================================
         * 聊天视图
         * 作用：与AI对话的主要界面
         * 包含：聊天头部、搜索栏、消息区域、输入区域
         * ========================================================================= -->
        <div class="chat-view" id="chatView">
            <!-- 聊天头部：返回按钮、聊天标题、设置按钮 -->
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-left">
                    <button class="back-btn" id="backBtn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="chat-title" id="chatTitle">聊天</div>
                </div>

            <!-- =========================================================================
            * 聊天设置菜单
            * 作用：点击设置按钮后弹出的功能菜单
            * 包含：搜索聊天记录、保存聊天记录两个选项
            * ========================================================================= -->       
                <button class="chat-settings-btn" id="chatSettingsBtn">
                    <i class="fas fa-ellipsis-h"></i>  <!-- 三个点的图标，适合做菜单 -->
                </button>
            </div>

            <!-- =========================================================================
            * 聊天设置菜单弹窗
            * 作用：点击设置按钮后显示的功能菜单
            * 包含：搜索聊天记录、保存聊天记录两个菜单项
            * ========================================================================= -->
            <div class="chat-settings-menu" id="chatSettingsMenu" style="display: none; position: absolute; top: 60px; right: 15px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px; z-index: 1000; min-width: 160px;">
                <button class="menu-item" id="menuSearchBtn" style="width: 100%; text-align: left; padding: 10px 15px; background: none; border: none; color: var(--text-primary); cursor: pointer; border-radius: 6px;">
                    <i class="fas fa-search" style="margin-right: 10px;"></i>搜索聊天记录
                </button>
                <button class="menu-item" id="menuSaveChatBtn" style="width: 100%; text-align: left; padding: 10px 15px; background: none; border: none; color: var(--text-primary); cursor: pointer; border-radius: 6px;">
                    <i class="fas fa-save" style="margin-right: 10px;"></i>保存聊天记录
                </button>
            </div>

            <!-- 搜索栏：搜索聊天记录（原功能） -->
            <div class="search-container" id="searchContainer">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索聊天记录...">
                <button class="search-cancel-btn" id="searchCancelBtn">取消</button>
            </div>
            
            <!-- 搜索结果导航：显示搜索结果数量和上下导航 -->
            <div class="search-results" id="searchResults">
                <div class="search-count" id="searchCount">找到 0 个结果</div>
                <div class="search-nav">
                    <button class="search-nav-btn" id="prevResult" disabled>上一个</button>
                    <button class="search-nav-btn" id="nextResult" disabled>下一个</button>
                </div>
            </div>

            <!-- 聊天视图容器：消息列表和输入框的容器 -->
            <div class="chat-view-container">
                <!-- 聊天消息容器：显示所有消息 -->
                <div class="chat-messages-container" id="chatMessagesContainer">
                    <!-- 对话消息会动态添加在这里 -->
                </div>  
                <!-- 输入区域：固定在聊天窗口底部 -->
                <div class="chat-input-section">
                    <div class="input-container">
                        <textarea 
                            class="message-input" 
                            id="messageInput"
                            placeholder="输入消息..." 
                            rows="1"
                        ></textarea>
                        <button class="lightbulb" id="lightbulb" title="AI帮答">
                            <i class="fas fa-lightbulb"></i>
                        </button>
                        <button class="send-button" id="sendButton" title="发送">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    
                    <!-- AI建议区域：显示AI生成的回复建议 -->
                    <div class="ai-suggestions" id="aiSuggestions">
                        <!-- AI建议将动态添加在这里 -->
                    </div>
                </div>
            </div>
        </div>
        <!-- =========================================================================
         * 设置视图
         * 作用：应用配置和设置页面
         * 包含：API配置、其他设置、进阶设置
         * ========================================================================= -->
        <div class="settings-view" id="settingsView">
            <div class="settings-container">
                <!-- API配置区域：模型提供方、API地址、密钥等 -->
                <div class="settings-section">
                    <div class="settings-title">
                        <i class="fas fa-cogs"></i>
                        API配置
                    </div>
                    <div class="form-group" id="customApiKeyGroup">
                        <label class="form-label">API密钥</label>
                        <input type="password" class="form-input" id="apiKey" placeholder="sk-xxxxxxxxxxxxxxxxxxxxxxxx">
                    </div>
                    <div class="form-group" id="customApiGroup">
                        <label class="form-label">API地址</label>
                        <input type="text" class="form-input" id="apiUrl" placeholder="例如：https://api.openai.com/v1/chat/completions">
                    </div>
                    <div class="form-group">
                        <label class="form-label">对话模型</label>
                        <div class="form-input-group" style="display: flex; gap: 10px;">
                            <input type="text" class="form-input" id="apiModel" placeholder="例如：gpt-3.5-turbo" style="flex: 1;">
                            <button class="btn btn-secondary" id="getModelsBtn" style="width: auto; padding: 10px 15px;">获取模型列表</button>
                        </div>
                        <select class="form-select" id="modelSelect" style="margin-top: 10px; display: none;">
                            <option value="">选择模型</option>
                        </select>
                        <small style="color: var(--text-muted); font-size: 12px; display: block; margin-top: 5px;">
                            提示：部分API提供商不支持获取模型列表，请手动输入模型名称
                        </small>
                    </div>
                    <div id="apiStatus" class="api-status" style="display: none;"></div>
                    <div class="form-actions">
                        <button class="btn btn-primary" id="saveApiConfigBtn">保存配置</button>
                    </div>
                </div>

                <!-- 其他设置区域：上下文长度、自动滚动等 -->
                <div class="settings-section">
                    <div class="settings-title">
                        <i class="fas fa-sliders-h"></i>
                        其他设置
                    </div>
                    <div class="form-group">
                        <label class="form-label">最大上下文长度</label>
                        <input type="number" class="form-input" id="maxContextLength" placeholder="10" value="10" min="1" max="50">
                        <small style="color: var(--text-muted); font-size: 12px;">保留最近的对话条数作为上下文</small>
                    </div>
                </div>

                <!-- 进阶设置区域：AI帮答提示词 -->
                <div class="settings-section">
                    <div class="settings-title">
                        <i class="fas fa-magic"></i>
                        进阶设置
                    </div>
                    <div class="form-group">
                        <label class="form-label">AI帮答提示词</label>
                        <textarea class="form-textarea" id="aiHelpPrompt" rows="3" placeholder="基于当前对话，生成一些回复建议...">请基于用户的当前对话内容，生成3-5个简短、自然、符合对话语境的回复建议。每个建议应该是一个完整的句子，能够帮助用户更好地表达自己的想法或继续对话。</textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- =========================================================================
         * 底部导航栏
         * 作用：在对话和设置页面之间切换
         * 使用场景：联系人列表和设置页面底部
         * ========================================================================= -->
        <div class="bottom-nav" id="bottomNav">
            <button class="nav-item active" id="navChat">
                <i class="fas fa-comments nav-icon"></i>
                <div>对话</div>
            </button>
            <button class="nav-item" id="navSettings">
                <i class="fas fa-cog nav-icon"></i>
                <div>设置</div>
            </button>
        </div>
    </div>

    <!-- =========================================================================
     * 创建聊天窗口模态框
     * 作用：两步表单创建新的聊天窗口
     * 步骤1：填写窗口名称
     * 步骤2：设置角色名称、描述和指令
     * ========================================================================= -->
    <div class="modal" id="createChatModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">创建聊天窗口</h2>
                <button class="modal-close" id="closeCreateChatModal">×</button>
            </div>
            <div class="step-indicator">
                <div class="step active" id="step1"></div>
                <div class="step" id="step2"></div>
            </div>
            
            <!-- 步骤1：窗口名称 -->
            <div class="step-container active" id="stepContainer1">
                <div class="form-group">
                    <label class="form-label">窗口名称</label>
                    <input type="text" class="form-input" id="windowName" placeholder="例如：心灵对话、日常聊天等">
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" id="cancelCreateBtn">取消</button>
                    <button class="btn btn-primary" id="nextStepBtn">下一步</button>
                </div>
            </div>
            
            <!-- 步骤2：角色设置 -->
            <div class="step-container" id="stepContainer2">
                <div class="form-group">
                    <label class="form-label">角色名称</label>
                    <input type="text" class="form-input" id="roleName" placeholder="例如：心灵导师、知心朋友等">
                </div>
                <div class="form-group">
                    <label class="form-label">角色描述</label>
                    <textarea class="form-textarea" id="roleDescription" rows="3" placeholder="描述角色的性格特点、背景设定等"></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">角色指令</label>
                    <textarea class="form-textarea" id="roleInstruction" rows="3" placeholder="给AI的系统指令，例如：你是一位耐心的倾听者...">你是一位耐心的倾听者，善于引导他人表达内心感受，提供温暖的陪伴和支持。</textarea>
                </div>
                <div class="form-actions">
                    <button class="btn btn-secondary" id="prevStepBtn">上一步</button>
                    <button class="btn btn-primary" id="createChatBtn">创建</button>
                </div>
            </div>
        </div>
    </div>

    <!-- =========================================================================
     * 确认删除模态框
     * 作用：删除联系人前的确认弹窗
     * 使用场景：滑动删除点击删除按钮后
     * ========================================================================= -->
    <div class="modal" id="confirmDeleteModal" style="display: none;">
        <div class="confirm-delete-modal">
            <div class="confirm-delete-text">确认删除这个对话窗口吗？</div>
            <div class="confirm-delete-actions">
                <button class="confirm-delete-btn cancel" id="cancelDeleteBtn">取消</button>
                <button class="confirm-delete-btn delete" id="confirmDeleteBtn">删除</button>
            </div>
        </div>
    </div>

<!-- =========================================================================
 * 保存聊天记录模态框
 * 作用：选择要保存的聊天消息，支持多选和搜索
 * 包含：搜索栏、消息列表、全选按钮、已选条数显示、保存按钮
 * ========================================================================= -->
 <div class="modal" id="saveChatModal" style="display: none;">
    <div class="modal-content" style="max-width: 500px; height: 80vh; display: flex; flex-direction: column;">
        <div class="modal-header">
            <h2 class="modal-title">保存聊天记录</h2>
            <button class="modal-close" id="closeSaveChatModal">×</button>
        </div>
        
        <!-- =========================================================================
         * 新增：保存模态框搜索栏
         * 作用：在保存聊天记录时搜索特定消息
         * 使用场景：用户需要快速定位特定消息时
         * ========================================================================= -->
        <div class="search-container" id="saveSearchContainer" style="display: flex; padding: 10px 0; border-bottom: 1px solid var(--border-color);">
            <input type="text" class="search-input" id="saveSearchInput" placeholder="搜索聊天记录..." style="flex: 1;">
            <button class="search-cancel-btn" id="saveSearchCancelBtn" style="margin-left: 10px;">取消</button>
        </div>
        
        <!-- =========================================================================
         * 新增：保存模态框搜索结果导航
         * 作用：显示搜索结果数量和上下导航
         * ========================================================================= -->
        <div class="search-results" id="saveSearchResults" style="display: none; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color);">
            <div class="search-count" id="saveSearchCount">找到 0 个结果</div>
            <div class="search-nav">
                <button class="search-nav-btn" id="savePrevResult" disabled>上一个</button>
                <button class="search-nav-btn" id="saveNextResult" disabled>下一个</button>
            </div>
        </div>
        
        <!-- 操作栏：全选/取消全选、已选数量 -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border-color);">
            <button class="btn btn-secondary" id="selectAllMessagesBtn" style="min-width: 200px; height: 36px; padding: 5px 15px; font-size: 13px; flex: none;">全选</button>
            <span id="selectedMessagesCount" style="color: var(--text-secondary); font-size: 13px;">已选择 0 条</span>
        </div>
        
        <!-- 消息列表容器（完全复用聊天窗口样式） -->
        <div class="save-messages-list" id="saveMessageList">
            <!-- 消息将动态添加到这里，样式完全复用聊天窗口 -->
        </div>
        
        <!-- 底部按钮：取消和保存 -->
        <div class="form-actions" style="margin-top: 0;">
            <button class="btn btn-secondary" id="cancelSaveChatBtn">取消</button>
            <button class="btn btn-primary" id="confirmSaveChatBtn">保存为图片</button>
        </div>      
    </div>
</div>

    <script>
        // =========================================================================
        // 全局数据状态管理
        // 作用：统一管理应用的所有数据，包括联系人、聊天记录、API配置等
        // 使用场景：整个应用中所有需要共享的数据都存储在这里
        // 说明：这是应用的核心数据仓库，任何需要跨函数共享的数据都放在这里
        // =========================================================================
        const state = {
            contacts: [],                    // 联系人列表数组，每个对象包含id、name、roleInstruction等
            currentContact: null,             // 当前选中的联系人对象
            messages: {},                     // 聊天记录对象，键为联系人ID，值为消息数组
            apiConfig: {                       // API配置对象
                provider: 'custom',             // 模型提供方：custom或xushuo
                url: '',                        // API地址
                key: '',                        // API密钥
                model: '',                      // 模型名称
                //temperature: 0.7,               // 温度参数
                availableModels: []              // 可用模型列表
            },
            appSettings: {                       // 应用设置对象
                maxContextLength: 10,             // 最大上下文长度
                aiHelpPrompt: '请基于用户的当前对话内容，生成2个简短、自然、符合对话语境的回复建议。每个建议应该是一个完整的句子，能够帮助用户更好地表达自己的想法或继续对话。'
            },
            isSearchActive: false,              // 搜索是否激活
            searchResults: [],                    // 搜索结果数组
            // 保存聊天相关状态
            selectedMessages: new Set(),        // 选中的消息ID集合
            isAllSelected: false,               // 是否全选
        // =========================================================================
        // 新增：保存模态框搜索状态
        // 作用：管理保存模态框中的搜索结果
        // =========================================================================
        saveSearchActive: false,            // 保存模态框搜索是否激活
        saveSearchResults: [],              // 保存模态框搜索结果数组
        saveCurrentSearchIndex: -1,         // 保存模态框当前搜索结果索引
        originalMessages: [],               // 保存原始消息列表（用于恢复）
    
            currentSearchIndex: -1,                // 当前搜索结果索引
            currentStep: 1,                        // 创建聊天的当前步骤
            contactToDelete: null                  // 待删除的联系人
        };

        // =========================================================================
        // DOM元素引用
        // 作用：缓存所有需要操作的DOM元素，避免重复查询
        // 使用场景：任何需要操作DOM的地方都通过这个对象访问
        // 说明：将所有需要操作的DOM元素集中管理，提高代码可维护性
        // =========================================================================
        const elements = {
            // 时间显示
            currentTime: document.getElementById('currentTime'),
            
            // 页面容器
            contactsView: document.getElementById('contactsView'),
            chatView: document.getElementById('chatView'),
            settingsView: document.getElementById('settingsView'),
            
            // 联系人列表
            addContactBtn: document.getElementById('addContactBtn'),
            contactList: document.getElementById('contactList'),
            
            // 聊天头部
            chatHeader: document.getElementById('chatHeader'),
            chatTitle: document.getElementById('chatTitle'),
            backBtn: document.getElementById('backBtn'),
            chatSettingsBtn: document.getElementById('chatSettingsBtn'),
            
            // 聊天设置菜单
            chatSettingsMenu: document.getElementById('chatSettingsMenu'),
            menuSearchBtn: document.getElementById('menuSearchBtn'),
            menuSaveChatBtn: document.getElementById('menuSaveChatBtn'),
            
            // 保存聊天模态框
            saveChatModal: document.getElementById('saveChatModal'),
            closeSaveChatModal: document.getElementById('closeSaveChatModal'),
            saveMessageList: document.getElementById('saveMessageList'),
            selectAllMessagesBtn: document.getElementById('selectAllMessagesBtn'),
            selectedMessagesCount: document.getElementById('selectedMessagesCount'),
            cancelSaveChatBtn: document.getElementById('cancelSaveChatBtn'),
            confirmSaveChatBtn: document.getElementById('confirmSaveChatBtn'),

            // 聊天区域
            chatMessagesContainer: document.getElementById('chatMessagesContainer'),
            messageInput: document.getElementById('messageInput'),
            sendButton: document.getElementById('sendButton'),
            lightbulb: document.getElementById('lightbulb'),
            aiSuggestions: document.getElementById('aiSuggestions'),
            
            // 导航
            navChat: document.getElementById('navChat'),
            navSettings: document.getElementById('navSettings'),
            bottomNav: document.getElementById('bottomNav'),
            
            // 搜索
            searchContainer: document.getElementById('searchContainer'),
            searchInput: document.getElementById('searchInput'),
            searchCancelBtn: document.getElementById('searchCancelBtn'),
            searchResults: document.getElementById('searchResults'),
            searchCount: document.getElementById('searchCount'),
            prevResult: document.getElementById('prevResult'),
            nextResult: document.getElementById('nextResult'),
            
            // 创建聊天模态框
            createChatModal: document.getElementById('createChatModal'),
            closeCreateChatModal: document.getElementById('closeCreateChatModal'),
            windowName: document.getElementById('windowName'),
            roleName: document.getElementById('roleName'),
            roleDescription: document.getElementById('roleDescription'),
            roleInstruction: document.getElementById('roleInstruction'),
            cancelCreateBtn: document.getElementById('cancelCreateBtn'),
            nextStepBtn: document.getElementById('nextStepBtn'),
            prevStepBtn: document.getElementById('prevStepBtn'),
            createChatBtn: document.getElementById('createChatBtn'),
            step1: document.getElementById('step1'),
            step2: document.getElementById('step2'),
            stepContainer1: document.getElementById('stepContainer1'),
            stepContainer2: document.getElementById('stepContainer2'),
            
            // 删除确认
            confirmDeleteModal: document.getElementById('confirmDeleteModal'),
            cancelDeleteBtn: document.getElementById('cancelDeleteBtn'),
            confirmDeleteBtn: document.getElementById('confirmDeleteBtn'),
            
            // 设置页面
            customApiGroup: document.getElementById('customApiGroup'),
            customApiKeyGroup: document.getElementById('customApiKeyGroup'),
            apiUrl: document.getElementById('apiUrl'),
            apiKey: document.getElementById('apiKey'),
            apiModel: document.getElementById('apiModel'),
            getModelsBtn: document.getElementById('getModelsBtn'),
            modelSelect: document.getElementById('modelSelect'),
            //temperature: document.getElementById('temperature'),
            apiStatus: document.getElementById('apiStatus'),
            saveApiConfigBtn: document.getElementById('saveApiConfigBtn'),
            maxContextLength: document.getElementById('maxContextLength'),
            aiHelpPrompt: document.getElementById('aiHelpPrompt')
        };

        // =========================================================================
        // 数据持久化 - 加载与保存
        // 作用：从localStorage读取数据，保存数据到localStorage
        // 使用场景：应用启动时加载，数据变化时保存
        // 说明：实现数据的本地存储，保证刷新页面后数据不丢失
        // =========================================================================

        /** 从LocalStorage加载所有保存的数据 */
        function loadFromLocalStorage() {
            try {
                const savedContacts = localStorage.getItem('echoGarden_contacts');
                const savedMessages = localStorage.getItem('echoGarden_messages');
                const savedApiConfig = localStorage.getItem('echoGarden_apiConfig');
                const savedAppSettings = localStorage.getItem('echoGarden_appSettings');
                
                if (savedContacts) {
                    state.contacts = JSON.parse(savedContacts);
                }
                
                if (savedMessages) {
                    state.messages = JSON.parse(savedMessages);
                }
                
                if (savedApiConfig) {
                    const apiConfig = JSON.parse(savedApiConfig);
                    state.apiConfig = { ...state.apiConfig, ...apiConfig };
                    // 更新表单显示
                    elements.apiUrl.value = apiConfig.url || '';
                    elements.apiKey.value = apiConfig.key || '';
                    elements.apiModel.value = apiConfig.model || '';
                    //elements.temperature.value = apiConfig.temperature || 0.7;
                }
                
                if (savedAppSettings) {
                    const appSettings = JSON.parse(savedAppSettings);
                    state.appSettings = { ...state.appSettings, ...appSettings };
                    elements.maxContextLength.value = appSettings.maxContextLength || 10;
                    elements.aiHelpPrompt.value = appSettings.aiHelpPrompt || state.appSettings.aiHelpPrompt;
                }
                
                // 如果没有数据，使用默认联系人
                if (state.contacts.length === 0) {
                    state.contacts = [
                        { 
                            id: Date.now(), 
                            name: '心灵花园', 
                            roleName: '心灵导师',
                            roleDescription: '一位善于倾听的心灵导师',
                            roleInstruction: '你是一位耐心的倾听者，善于引导他人表达内心感受，提供温暖的陪伴和支持。',
                            avatar: '🧘', 
                            preview: '欢迎来到心灵花园...', 
                            lastTime: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) 
                        }
                    ];
                }
                
            } catch (e) {
                console.error('加载本地存储数据失败:', e);
            }
        }

        /** 保存所有数据到LocalStorage */
        function saveToLocalStorage() {
            try {
                localStorage.setItem('echoGarden_contacts', JSON.stringify(state.contacts));
                localStorage.setItem('echoGarden_messages', JSON.stringify(state.messages));
                localStorage.setItem('echoGarden_apiConfig', JSON.stringify(state.apiConfig));
                localStorage.setItem('echoGarden_appSettings', JSON.stringify(state.appSettings));
            } catch (e) {
                console.error('保存到本地存储失败:', e);
            }
        }

        /** 获取当前时间字符串 (HH:MM格式) */
        function getCurrentTime() {
            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' + 
                   now.getMinutes().toString().padStart(2, '0');
        }

        /** 更新时间显示 */
        function updateTime() {
            const timeString = getCurrentTime();
            if (elements.currentTime) {
                elements.currentTime.textContent = timeString;
            }
        }

        // =========================================================================
        // 联系人列表管理
        // 作用：渲染和管理联系人列表，包括滑动删除功能
        // 使用场景：联系人列表页面
        // 说明：处理联系人的显示、点击、滑动删除等交互
        // =========================================================================

        /** 渲染整个联系人列表 */
        function renderContacts() {
            elements.contactList.innerHTML = '';
            
            if (state.contacts.length === 0) {
                elements.contactList.innerHTML = `
                    <div class="welcome-message" style="text-align: center; padding: 40px 20px;">
                        <p>还没有聊天窗口</p>
                        <p>点击上方的 + 号创建一个</p>
                    </div>
                `;
                return;
            }
            
            state.contacts.forEach(contact => {
                const contactItem = document.createElement('div');
                contactItem.className = `contact-item ${state.currentContact?.id === contact.id ? 'active' : ''}`;
                contactItem.dataset.id = contact.id;
                
                // 创建滑动删除结构
                contactItem.innerHTML = `
                    <div class="contact-item-wrapper">
                        <div class="contact-avatar">${contact.avatar}</div>
                        <div class="contact-info">
                            <div class="contact-name">${contact.name}</div>
                            <div class="contact-preview">${contact.preview}</div>
                        </div>
                    </div>
                    <div class="delete-action">
                        <span>删除</span>
                    </div>
                `;
                
                // 添加点击事件
                const contactWrapper = contactItem.querySelector('.contact-item-wrapper');
                contactWrapper.addEventListener('click', (e) => {
                    if (!contactItem.classList.contains('swiped')) {
                        openChat(contact);
                    }
                });
                
                // 添加滑动事件
                let touchStartX = 0;
                let touchStartY = 0;
                let isScrolling = false;
                
                contactWrapper.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isScrolling = false;
                }, { passive: true });
                
                contactWrapper.addEventListener('touchmove', (e) => {
                    if (!touchStartX || !touchStartY) return;
                    
                    const touchX = e.touches[0].clientX;
                    const touchY = e.touches[0].clientY;
                    
                    // 判断是垂直滚动还是水平滑动
                    const diffX = touchStartX - touchX;
                    const diffY = touchStartY - touchY;
                    
                    if (Math.abs(diffY) > Math.abs(diffX)) {
                        // 垂直滚动
                        isScrolling = true;
                    } else if (diffX > 30 && !isScrolling) {
                        // 向左滑动超过30px，显示删除按钮
                        e.preventDefault();
                        contactItem.classList.add('swiped');
                    } else if (diffX < -30) {
                        // 向右滑动，隐藏删除按钮
                        contactItem.classList.remove('swiped');
                    }
                }, { passive: false });
                
                contactWrapper.addEventListener('touchend', () => {
                    touchStartX = 0;
                    touchStartY = 0;
                }, { passive: true });
                
                // 删除按钮点击事件
                const deleteAction = contactItem.querySelector('.delete-action');
                deleteAction.addEventListener('click', () => {
                    state.contactToDelete = contact;
                    showConfirmDeleteModal();
                });
                
                elements.contactList.appendChild(contactItem);
            });
        }

        /** 显示确认删除模态框 */
        function showConfirmDeleteModal() {
            elements.confirmDeleteModal.style.display = 'flex';
        }

        /** 隐藏确认删除模态框 */
        function hideConfirmDeleteModal() {
            elements.confirmDeleteModal.style.display = 'none';
            state.contactToDelete = null;
            
            // 重置所有联系人的滑动状态
            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('swiped');
            });
        }

        /** 删除联系人 */
        function deleteContact() {
            if (!state.contactToDelete) return;
            
            const contactId = state.contactToDelete.id;
            
            // 从联系人列表中移除
            state.contacts = state.contacts.filter(contact => contact.id !== contactId);
            
            // 如果删除的是当前聊天窗口，返回联系人列表
            if (state.currentContact && state.currentContact.id === contactId) {
                showContactsView();
                state.currentContact = null;
            }
            
            // 删除对应的消息记录
            delete state.messages[contactId];
            
            // 更新UI
            renderContacts();
            saveToLocalStorage();
            
            // 隐藏模态框
            hideConfirmDeleteModal();
        }

        // =========================================================================
        // 聊天消息管理
        // 作用：处理聊天消息的渲染、添加、滚动等
        // 使用场景：聊天页面
        // 说明：负责消息的显示、消息菜单、右键功能等
        // =========================================================================

        /** 渲染指定联系人的所有聊天消息 */
        function renderMessages(contactId) {
            const messages = state.messages[contactId] || [];
            elements.chatMessagesContainer.innerHTML = '';
            
            if (messages.length === 0) {
                const welcomeDiv = document.createElement('div');
                welcomeDiv.className = 'welcome-message';
                welcomeDiv.textContent = '对话内容由AI生成';
                elements.chatMessagesContainer.appendChild(welcomeDiv);
            } else {
                messages.forEach(msg => {
                    // 渲染历史消息时，传入 false 表示不需要自动滚动（因为还没渲染完）
                    addMessageToDOM(msg, false);
                });
            }
            
            // 所有历史消息渲染完成后，滚动到底部
            scrollToBottom();
            
        }

        /** 添加单条消息到DOM */
        function addMessageToDOM(message, shouldScroll = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.isUser ? 'user' : 'ai'}`;
            messageDiv.dataset.id = message.id;
            messageDiv.dataset.isUser = message.isUser;

            // =========================================================================
            // 构建消息HTML
            // 作用：根据消息类型显示不同位置的时间
            // AI消息：时间显示在左下角
            // 用户消息：时间显示在右下角
            // =========================================================================
            let messageHTML = `<div class="message-content">${message.content}</div>`;
            messageHTML += `<div class="message-time">${message.time}</div>`;

            messageDiv.innerHTML = messageHTML;  // 使用构建好的 HTML

            // 添加长按事件（右键菜单）
            messageDiv.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showMessageMenu(e, message);
            });
            
            elements.chatMessagesContainer.appendChild(messageDiv);

            // 因为新消息应该总是显示出来
            scrollToBottom();
            
        }

        /** 滚动到聊天底部 */
        function scrollToBottom() {
            setTimeout(() => {
                elements.chatMessagesContainer.scrollTop = elements.chatMessagesContainer.scrollHeight;
            }, 100);
        }

        /** 打开聊天窗口 */
        function openChat(contact) {
            state.currentContact = contact;
            
            // 隐藏底部导航栏
            elements.bottomNav.style.display = 'none';
            
            // 切换视图
            elements.contactsView.style.display = 'none';
            elements.settingsView.style.display = 'none';
            elements.chatView.classList.add('active');
            
            // 更新聊天标题
            elements.chatTitle.textContent = contact.name;
            
            // 渲染消息
            renderMessages(contact.id);
            
            // 聚焦输入框
            setTimeout(() => {
                elements.messageInput.focus();
            }, 100);
            
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            elements.navChat.classList.add('active');
        }

        /** 显示消息右键菜单 */
        function showMessageMenu(e, message) {
            // 移除现有的菜单
            const existingMenu = document.querySelector('.message-menu');
            if (existingMenu) {
                existingMenu.remove();
            }
            
            // 创建新菜单
            const menu = document.createElement('div');
            menu.className = 'message-menu';
            menu.style.position = 'absolute';
            menu.style.zIndex = '1000';
            
            // 计算菜单位置
            const rect = elements.chatMessagesContainer.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            // 确保菜单位置在容器内
            if (x > rect.width - 120) x = rect.width - 120;
            if (x < 10) x = 10;
            if (y > rect.height - 100) y = rect.height - 100;
            if (y < 10) y = 10;
            
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            
            menu.innerHTML = `
                <button class="menu-item copy-btn"><i class="fas fa-copy"></i>复制</button>
                <button class="menu-item delete-btn"><i class="fas fa-trash"></i>删除</button>
            `;
            
            elements.chatMessagesContainer.appendChild(menu);
            
            // 设置点击事件
            menu.querySelector('.copy-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(message.content);
                menu.remove();
            });
            
            menu.querySelector('.delete-btn').addEventListener('click', () => {
                const contactId = state.currentContact.id;
                state.messages[contactId] = state.messages[contactId].filter(m => m.id !== message.id);
                renderMessages(contactId);
                saveToLocalStorage();
                menu.remove();
            });
            
            // 点击其他地方关闭菜单
            setTimeout(() => {
                const closeMenu = (clickEvent) => {
                    if (!menu.contains(clickEvent.target)) {
                        menu.remove();
                        document.removeEventListener('click', closeMenu);
                    }
                };
                document.addEventListener('click', closeMenu);
            }, 10);
        }

        // =========================================================================
        // 发送消息与API调用
        // 作用：处理消息发送、API调用和错误处理
        // 使用场景：用户点击发送按钮或按回车
        // 说明：包含详细的错误处理，将错误信息显示给用户
        // =========================================================================

        /** 发送消息（主函数） */
        async function sendMessage() {
            const content = elements.messageInput.value.trim();
            if (!content || !state.currentContact) return;
            
            // 创建用户消息对象
            const userMessage = {
                id: Date.now(),
                content: content,
                isUser: true,
                time: new Date().toLocaleTimeString('zh-CN', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: false  // 使用24小时制
                })
            };
            
            // 添加到DOM
            addMessageToDOM(userMessage);
            
            // 保存到状态
            const contactId = state.currentContact.id;
            if (!state.messages[contactId]) {
                state.messages[contactId] = [];
            }
            
            // 更新联系人预览
            state.currentContact.preview = content.length > 20 ? content.substring(0, 20) + '...' : content;
            state.currentContact.lastTime = userMessage.time;
            
            // 清空输入框
            elements.messageInput.value = '';
            autoResizeTextarea();
            
            // 显示加载状态
            const loadingMessage = {
                id: Date.now() + 1,
                content: '正在思考...',
                isUser: false,
                time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
            };
            
            addMessageToDOM(loadingMessage);
            
            // 调用API
            const aiResponse = await sendMessageToAPI(content, state.currentContact);
            
            // 移除加载消息
            elements.chatMessagesContainer.removeChild(elements.chatMessagesContainer.lastChild);
            
            if (aiResponse) {
                // 保存用户消息到历史
                state.messages[contactId].push(userMessage);
                
                // 创建AI消息对象
                const aiMessage = {
                    id: Date.now() + 2,
                    content: aiResponse,
                    isUser: false,
                    time: new Date().toLocaleTimeString('zh-CN', { 
                        hour: '2-digit', 
                        minute: '2-digit',
                        hour12: false
                    })
                };
                
                // 添加到DOM
                addMessageToDOM(aiMessage);
                
                // 保存到状态
                state.messages[contactId].push(aiMessage);
                
                // 更新联系人预览
                state.currentContact.preview = aiResponse.length > 20 ? aiResponse.substring(0, 20) + '...' : aiResponse;
                state.currentContact.lastTime = aiMessage.time;
            } else {
                // API调用失败，将用户消息保存到历史中
                state.messages[contactId].push(userMessage);
                
                // 获取API状态中显示的错误信息
                let errorContent = '抱歉，我暂时无法回复。请检查API配置或网络连接。';
                
                // 检查是否有错误状态显示
                if (elements.apiStatus && elements.apiStatus.style.display === 'block' && elements.apiStatus.textContent) {
                    errorContent = elements.apiStatus.textContent;
                }
                
                // 显示错误消息
                const errorMessage = {
                    id: Date.now() + 2,
                    content: errorContent,
                    isUser: false,
                    time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
                };
                
                addMessageToDOM(errorMessage);
                state.messages[contactId].push(errorMessage);
            }
            
            // 更新联系人列表和保存
            renderContacts();
            saveToLocalStorage();
        }

        /** 发送消息到API（包含详细的错误处理） */
        async function sendMessageToAPI(userMessage, contact) {
            // 检查API配置
            if (!state.apiConfig.url || !state.apiConfig.key) {
                showAPIStatus('请先配置API设置', 'error');
                return null;
            }

            // 构建消息历史
            const messages = [
            {
                role: 'system',
                content: contact.roleInstruction || '你是一位耐心的倾听者，善于引导他人表达内心感受，提供温暖的陪伴和支持。'
            }
        ];

        // 添加上下文消息
        const history = state.messages[contact.id] || [];
        const maxContext = parseInt(state.appSettings.maxContextLength) || 10;
        const recentHistory = history.slice(-maxContext);
        
        // 排除可能已经存在的当前用户消息
        let filteredHistory = recentHistory;
        if (recentHistory.length > 0) {
            const lastMsg = recentHistory[recentHistory.length - 1];
            if (lastMsg.isUser && lastMsg.content === userMessage) {
                filteredHistory = recentHistory.slice(0, -1);
            }
        }
        
        filteredHistory.forEach(msg => {
            messages.push({
                role: msg.isUser ? 'user' : 'assistant',
                content: msg.content
            });
        });

        // 添加当前用户消息
        messages.push({
            role: 'user',
            content: userMessage
        });

        try {
            let response;
                const requestBody = {
