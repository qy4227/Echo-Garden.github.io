<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>回声庭院 - 你的心灵花园</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1f2c;
            --bg-secondary: #252a38;
            --bg-card: #2d3748;
            --accent-primary: #38b2ac;
            --accent-secondary: #ed8936;
            --accent-glow: #4fd1c7;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #718096;
            --border-color: #2d3748;
            --shadow-color: rgba(26, 31, 44, 0.8);
            --danger-color: #ff3b30;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(56, 178, 172, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(237, 137, 54, 0.05) 0%, transparent 50%);
        }

        /* 移动端容器 */
        .app-container {
            max-width: 400px;
            min-height: 100vh;
            margin: 0 auto;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 状态栏 */
        .status-bar {
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-primary);
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
        }

        .app-name {
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 1px;
            color: var(--accent-primary);
        }

        .time {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* 联系人标题栏 */
        .contacts-header {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }

        .contacts-title {
            font-size: 18px;
            font-weight: 500;
        }

        .add-contact-btn {
            background: var(--accent-primary);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .add-contact-btn:hover {
            background: var(--accent-glow);
            transform: scale(1.1);
        }

        /* 聊天头部 */
        .chat-header {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }

        .chat-title {
            font-size: 18px;
            font-weight: 500;
        }

        .chat-settings-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
        }

        /* 聊天视图容器 */
        .chat-view-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        /* 聊天消息容器 */
        .chat-messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
            padding-bottom: 80px; /* 为输入框留出空间 */
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            transition: all 0.3s ease;
            word-wrap: break-word;
            overflow-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent-primary);
            color: white;
            border-bottom-right-radius: 6px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 6px;
        }

        .message.highlight {
            background-color: rgba(56, 178, 172, 0.3);
            border: 1px solid var(--accent-primary);
            box-shadow: 0 0 10px rgba(56, 178, 172, 0.5);
        }

        .welcome-message {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-style: italic;
            font-size: 13px;
        }

        /* 输入区域 - 固定在聊天窗口底部 */
        .chat-input-section {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: end;
        }

        .message-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 12px 18px;
            color: var(--text-primary);
            font-size: 14px;
            resize: none;
            max-height: 120px;
            min-height: 44px;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 2px rgba(56, 178, 172, 0.2);
        }

        .message-input::placeholder {
            color: var(--text-muted);
        }

        .lightbulb {
            background: var(--accent-secondary);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 20px;
        }
        
        .lightbulb:hover {
            transform: scale(1.1);
        }

        .send-button {
            background: var(--accent-primary);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
        }

        .send-button:hover {
            background: var(--accent-glow);
            transform: scale(1.05);
        }

        /* AI建议区域 */
        .ai-suggestions {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            padding-bottom: 5px;
        }

        .ai-suggestions.active {
            display: flex;
        }

        .suggestion {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .suggestion:hover {
            background: var(--accent-primary);
            color: white;
        }

        /* 底部导航 - 只在对话页面显示 */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            padding: 12px 15px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            position: sticky;
            bottom: 0;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 11px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: none;
            border: none;
            color: inherit;
            font-family: inherit;
        }

        .nav-item.active {
            color: var(--accent-primary);
        }

        .nav-item.highlight {
            color: var(--accent-secondary);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        /* 滚动条样式 */
        .chat-messages-container::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages-container::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        .chat-messages-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }

        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 花园装饰元素 */
        .decoration {
            position: absolute;
            font-size: 12px;
            opacity: 0.3;
            z-index: -1;
        }

        .decoration-1 { top: 15%; left: 10%; }
        .decoration-2 { top: 25%; right: 8%; }
        .decoration-3 { bottom: 30%; left: 5%; }

        /* 搜索结果导航 */
        .search-container {
            padding: 10px 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: none;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .search-input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 15px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .search-cancel-btn {
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        .search-results {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .search-results.active {
            display: flex;
        }
        
        .search-nav-btn {
            background: var(--accent-primary);
            border: none;
            border-radius: 15px;
            padding: 5px 10px;
            color: white;
            font-size: 11px;
            cursor: pointer;
        }
        
        .search-nav-btn:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 500;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 10px 15px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        /* 联系人列表样式 */
        .contact-list {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 60px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .contact-item:hover {
            background: var(--bg-card);
        }

        .contact-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: white;
            font-size: 18px;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-preview {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 滑动删除样式 */
        .contact-item-wrapper {
            display: flex;
            align-items: center;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .delete-action {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            background: var(--danger-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .contact-item.swiped .delete-action {
            transform: translateX(0);
        }

        .contact-item.swiped .contact-item-wrapper {
            transform: translateX(-80px);
        }

        /* 设置页面样式 */
        .settings-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 15px 80px;
        }

        .settings-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-section:last-child {
            border-bottom: none;
        }

        .settings-title {
            font-size: 16px;
            margin-bottom: 15px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .settings-title i {
            color: var(--accent-primary);
        }

        /* API状态 */
        .api-status {
            margin-top: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            text-align: center;
        }

        .api-status.success {
            background: rgba(56, 178, 172, 0.2);
            color: var(--accent-primary);
        }

        .api-status.error {
            background: rgba(255, 59, 48, 0.2);
            color: #ff3b30;
        }

        /* 步骤指示器 */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .step {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--text-muted);
        }

        .step.active {
            background: var(--accent-primary);
        }

        /* 步骤容器 */
        .step-container {
            display: none;
        }

        .step-container.active {
            display: block;
        }

        /* 视图切换 */
        .contacts-view {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-view {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .chat-view.active {
            display: flex;
        }

        .settings-view {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .settings-view.active {
            display: flex;
        }

        /* 消息操作菜单 */
        .message-menu {
            position: absolute;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            min-width: 120px;
            display: none;
        }

        .menu-item {
            display: block;
            width: 100%;
            padding: 8px 12px;
            background: none;
            border: none;
            text-align: left;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            border-radius: 6px;
            margin: 2px 0;
        }

        .menu-item:hover {
            background: var(--bg-card);
        }

        .menu-item i {
            margin-right: 8px;
            width: 16px;
        }

        /* 确认删除模态框 */
        .confirm-delete-modal {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 25px;
            width: 80%;
            max-width: 300px;
            text-align: center;
        }

        .confirm-delete-text {
            margin-bottom: 20px;
            font-size: 16px;
            color: var(--text-primary);
        }

        .confirm-delete-actions {
            display: flex;
            gap: 10px;
        }

        .confirm-delete-btn {
            flex: 1;
            padding: 10px 15px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .confirm-delete-btn.cancel {
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .confirm-delete-btn.delete {
            background: var(--danger-color);
            color: white;
        }

        .confirm-delete-btn.cancel:hover {
            background: var(--border-color);
        }

        .confirm-delete-btn.delete:hover {
            background: #ff1a1a;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 装饰元素 -->
        <div class="decoration decoration-1">🌙</div>
        <div class="decoration decoration-2">⭐</div>
        <div class="decoration decoration-3">✨</div>

        <!-- 联系人列表视图 -->
        <div class="contacts-view" id="contactsView">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="app-name">回声庭院</div>
                <div class="time" id="currentTime">21:30</div>
            </div>

            <!-- 联系人标题栏 -->
            <div class="contacts-header">
                <div class="contacts-title">对话</div>
                <button class="add-contact-btn" id="addContactBtn" title="新建对话">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <!-- 联系人列表 -->
            <div class="contact-list" id="contactList">
                <!-- 联系人将动态添加到这里 -->
            </div>
        </div>

        <!-- 聊天视图 -->
        <div class="chat-view" id="chatView">
            <!-- 聊天头部 -->
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-left">
                    <button class="back-btn" id="backBtn">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="chat-title" id="chatTitle">聊天</div>
                </div>
                <button class="chat-settings-btn" id="chatSettingsBtn">
                    <i class="fas fa-ellipsis-h"></i>
                </button>
            </div>

            <!-- 搜索栏 -->
            <div class="search-container" id="searchContainer">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索聊天记录...">
                <button class="search-cancel-btn" id="searchCancelBtn">取消</button>
            </div>
            
            <!-- 搜索结果导航 -->
            <div class="search-results" id="searchResults">
                <div class="search-count" id="searchCount">找到 0 个结果</div>
                <div class="search-nav">
                    <button class="search-nav-btn" id="prevResult" disabled>上一个</button>
                    <button class="search-nav-btn" id="nextResult" disabled>下一个</button>
                </div>
            </div>

            <!-- 聊天视图容器 -->
            <div class="chat-view-container">
                <!-- 聊天消息容器 -->
                <div class="chat-messages-container" id="chatMessagesContainer">
                    <!-- 对话消息会动态添加在这里 -->
                </div>

                <!-- 输入区域 - 固定在聊天窗口底部 -->
                <div class="chat-input-section">
                    <div class="input-container">
                        <textarea 
                            class="message-input" 
                            id="messageInput"
                            placeholder="在这里诉说你的心声..." 
                            rows="1"
                        ></textarea>
                        <button class="lightbulb" id="lightbulb" title="AI帮答">
                            <i class="fas fa-lightbulb"></i>
                        </button>
                        <button class="send-button" id="sendButton" title="发送">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                    
                    <!-- AI建议区域 -->
                    <div class="ai-suggestions" id="aiSuggestions">
                        <!-- AI建议将动态添加在这里 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- 设置视图 -->
        <div class="settings-view" id="settingsView">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="app-name">设置</div>
                <div class="time" id="settingsTime">21:30</div>
            </div>

            <div class="settings-container">
                <!-- API配置 -->
                <div class="settings-section">
                    <div class="settings-title">
                        <i class="fas fa-cogs"></i>
                        API配置
                    </div>
                    <div class="form-group">
                        <label class="form-label">模型提供方</label>

        // 从LocalStorage加载数据
        function loadFromLocalStorage() {
            try {
                const savedContacts = localStorage.getItem('echoGarden_contacts');
                const savedMessages = localStorage.getItem('echoGarden_messages');
                const savedApiConfig = localStorage.getItem('echoGarden_apiConfig');
                const savedAppSettings = localStorage.getItem('echoGarden_appSettings');
                
                if (savedContacts) {
                    state.contacts = JSON.parse(savedContacts);
                }
                
                if (savedMessages) {
                    state.messages = JSON.parse(savedMessages);
                }
                
                if (savedApiConfig) {
                    const apiConfig = JSON.parse(savedApiConfig);
                    state.apiConfig = { ...state.apiConfig, ...apiConfig };
                    elements.apiProvider.value = apiConfig.provider || 'custom';
                    elements.apiUrl.value = apiConfig.url || '';
                    elements.apiKey.value = apiConfig.key || '';
                    elements.apiModel.value = apiConfig.model || 'gpt-3.5-turbo';
                    elements.temperature.value = apiConfig.temperature || 0.7;
                    
                    // 更新API提供方显示
                    updateApiProviderDisplay();
                }
                
                if (savedAppSettings) {
                    const appSettings = JSON.parse(savedAppSettings);
                    state.appSettings = { ...state.appSettings, ...appSettings };
                    elements.maxContextLength.value = appSettings.maxContextLength || 10;
                    elements.autoScroll.checked = appSettings.autoScroll !== false;
                    elements.aiHelpPrompt.value = appSettings.aiHelpPrompt || state.appSettings.aiHelpPrompt;
                }
                
                // 如果没有数据，使用默认联系人
                if (state.contacts.length === 0) {
                    state.contacts = [
                        { 
                            id: Date.now(), 
                            name: '心灵花园', 
                            roleName: '心灵导师',
                            roleDescription: '一位善于倾听的心灵导师',
                            roleInstruction: '你是一位耐心的倾听者，善于引导他人表达内心感受，提供温暖的陪伴和支持。',
                            avatar: '🧘', 
                            preview: '欢迎来到心灵花园...', 
                            lastTime: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) 
                        }
                    ];
                }
                
            } catch (e) {
                console.error('加载本地存储数据失败:', e);
            }
        }

        // 保存数据到LocalStorage
        function saveToLocalStorage() {
            try {
                localStorage.setItem('echoGarden_contacts', JSON.stringify(state.contacts));
                localStorage.setItem('echoGarden_messages', JSON.stringify(state.messages));
                localStorage.setItem('echoGarden_apiConfig', JSON.stringify(state.apiConfig));
                localStorage.setItem('echoGarden_appSettings', JSON.stringify(state.appSettings));
            } catch (e) {
                console.error('保存到本地存储失败:', e);
            }
        }

        // 更新时间显示
        function updateTime() {
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + 
                             now.getMinutes().toString().padStart(2, '0');
            elements.currentTime.textContent = timeString;
            elements.settingsTime.textContent = timeString;
        }

        // 渲染联系人列表
        function renderContacts() {
            elements.contactList.innerHTML = '';
            
            if (state.contacts.length === 0) {
                elements.contactList.innerHTML = `
                    <div class="welcome-message" style="text-align: center; padding: 40px 20px;">
                        <p>还没有聊天窗口</p>
                        <p>点击上方的 + 号创建一个</p>
                    </div>
                `;
                return;
            }
            
            state.contacts.forEach(contact => {
                const contactItem = document.createElement('div');
                contactItem.className = `contact-item ${state.currentContact?.id === contact.id ? 'active' : ''}`;
                contactItem.dataset.id = contact.id;
                
                // 创建滑动删除结构
                contactItem.innerHTML = `
                    <div class="contact-item-wrapper">
                        <div class="contact-avatar">${contact.avatar}</div>
                        <div class="contact-info">
                            <div class="contact-name">${contact.name}</div>
                            <div class="contact-preview">${contact.preview}</div>
                        </div>
                    </div>
                    <div class="delete-action">
                        <span>删除</span>
                    </div>
                `;
                
                // 添加点击事件
                const contactWrapper = contactItem.querySelector('.contact-item-wrapper');
                contactWrapper.addEventListener('click', (e) => {
                    if (!contactItem.classList.contains('swiped')) {
                        openChat(contact);
                    }
                });
                
                // 添加滑动事件
                let touchStartX = 0;
                let touchStartY = 0;
                let isScrolling = false;
                
                contactWrapper.addEventListener('touchstart', (e) => {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    isScrolling = false;
                }, { passive: true });
                
                contactWrapper.addEventListener('touchmove', (e) => {
                    if (!touchStartX || !touchStartY) return;
                    
                    const touchX = e.touches[0].clientX;
                    const touchY = e.touches[0].clientY;
                    
                    // 判断是垂直滚动还是水平滑动
                    const diffX = touchStartX - touchX;
                    const diffY = touchStartY - touchY;
                    
                    if (Math.abs(diffY) > Math.abs(diffX)) {
                        // 垂直滚动
                        isScrolling = true;
                    } else if (diffX > 30 && !isScrolling) {
                        // 向左滑动超过30px，显示删除按钮
                        e.preventDefault();
                        contactItem.classList.add('swiped');
                    } else if (diffX < -30) {
                        // 向右滑动，隐藏删除按钮
                        contactItem.classList.remove('swiped');
                    }
                }, { passive: false });
                
                contactWrapper.addEventListener('touchend', () => {
                    touchStartX = 0;
                    touchStartY = 0;
                }, { passive: true });
                
                // 删除按钮点击事件
                const deleteAction = contactItem.querySelector('.delete-action');
                deleteAction.addEventListener('click', () => {
                    state.contactToDelete = contact;
                    showConfirmDeleteModal();
                });
                
                elements.contactList.appendChild(contactItem);
            });
        }

        // 显示确认删除模态框
        function showConfirmDeleteModal() {
            elements.confirmDeleteModal.style.display = 'flex';
        }

        // 隐藏确认删除模态框
        function hideConfirmDeleteModal() {
            elements.confirmDeleteModal.style.display = 'none';
            state.contactToDelete = null;
            
            // 重置所有联系人的滑动状态
            document.querySelectorAll('.contact-item').forEach(item => {
                item.classList.remove('swiped');
            });
        }

        // 删除联系人
        function deleteContact() {
            if (!state.contactToDelete) return;
            
            const contactId = state.contactToDelete.id;
            
            // 从联系人列表中移除
            state.contacts = state.contacts.filter(contact => contact.id !== contactId);
            
            // 如果删除的是当前聊天窗口，返回联系人列表
            if (state.currentContact && state.currentContact.id === contactId) {
                showContactsView();
                state.currentContact = null;
            }
            
            // 删除对应的消息记录
            delete state.messages[contactId];
            
            // 更新UI
            renderContacts();
            saveToLocalStorage();
            
            // 隐藏模态框
            hideConfirmDeleteModal();
        }

        // 渲染聊天消息
        function renderMessages(contactId) {
            const messages = state.messages[contactId] || [];
            elements.chatMessagesContainer.innerHTML = '';
            
            if (messages.length === 0) {
                const welcomeDiv = document.createElement('div');
                welcomeDiv.className = 'welcome-message';
                welcomeDiv.textContent = '开始新的对话...';
                elements.chatMessagesContainer.appendChild(welcomeDiv);
            } else {
                messages.forEach(msg => {
                    addMessageToDOM(msg, false);
                });
            }
            
            // 确保滚动到底部显示最新消息
            if (state.appSettings.autoScroll) {
                scrollToBottom();
            }
        }

        // 添加消息到DOM
        function addMessageToDOM(message, shouldScroll = true) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${message.isUser ? 'user' : 'ai'}`;
            messageDiv.dataset.id = message.id;
            messageDiv.dataset.isUser = message.isUser;
            messageDiv.innerHTML = `
                <div class="message-content">${message.content}</div>
            `;
            
            // 添加长按事件
            messageDiv.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                showMessageMenu(e, message);
            });
            
            elements.chatMessagesContainer.appendChild(messageDiv);
            
            if (shouldScroll && state.appSettings.autoScroll) {
                scrollToBottom();
            }
        }

        // 滚动到聊天底部
        function scrollToBottom() {
            setTimeout(() => {
                elements.chatMessagesContainer.scrollTop = elements.chatMessagesContainer.scrollHeight;
            }, 100);
        }

        // 打开聊天
        function openChat(contact) {
            state.currentContact = contact;
            
            // 隐藏底部导航栏
            elements.bottomNav.style.display = 'none';
            
            // 切换视图
            elements.contactsView.style.display = 'none';
            elements.settingsView.style.display = 'none';
            elements.chatView.classList.add('active');
            
            // 更新聊天标题
            elements.chatTitle.textContent = contact.name;
            
            // 渲染消息
            renderMessages(contact.id);
            
            // 聚焦输入框
            setTimeout(() => {
                elements.messageInput.focus();
            }, 100);
            
            // 更新导航状态
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            elements.navChat.classList.add('active');
        }

        // 显示消息菜单
        function showMessageMenu(e, message) {
            // 移除现有的菜单
            const existingMenu = document.querySelector('.message-menu');
            if (existingMenu) {
                existingMenu.remove();
            }
            
            // 创建新菜单
            const menu = document.createElement('div');
            menu.className = 'message-menu';
            menu.style.position = 'absolute';
            menu.style.zIndex = '1000';
            
            // 计算菜单位置
            const rect = elements.chatMessagesContainer.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            // 确保菜单位置在容器内
            if (x > rect.width - 120) x = rect.width - 120;
            if (x < 10) x = 10;
            if (y > rect.height - 100) y = rect.height - 100;
            if (y < 10) y = 10;
            
            menu.style.left = x + 'px';
            menu.style.top = y + 'px';
            
            menu.innerHTML = `
                <button class="menu-item copy-btn"><i class="fas fa-copy"></i>复制</button>
                <button class="menu-item delete-btn"><i class="fas fa-trash"></i>删除</button>
            `;
            
            elements.chatMessagesContainer.appendChild(menu);
            
            // 设置点击事件
            menu.querySelector('.copy-btn').addEventListener('click', () => {
                navigator.clipboard.writeText(message.content);
                menu.remove();
            });
            
            menu.querySelector('.delete-btn').addEventListener('click', () => {
                const contactId = state.currentContact.id;
                state.messages[contactId] = state.messages[contactId].filter(m => m.id !== message.id);
                renderMessages(contactId);
                saveToLocalStorage();
                menu.remove();
            });
            
            // 点击其他地方关闭菜单
            setTimeout(() => {
                const closeMenu = (clickEvent) => {
                    if (!menu.contains(clickEvent.target)) {
                        menu.remove();
                        document.removeEventListener('click', closeMenu);
                    }
                };
                document.addEventListener('click', closeMenu);
            }, 10);
        }

        // 发送消息到API - 修复版本
async function sendMessageToAPI(userMessage, contact) {
    // 检查API配置
    if (state.apiConfig.provider === 'custom') {
        if (!state.apiConfig.url || !state.apiConfig.key) {
            showAPIStatus('请先配置API设置', 'error');
            return null;
        }
    }

    // 构建消息历史
    const messages = [
        {
            role: 'system',
            content: contact.roleInstruction || '你是一位耐心的倾听者，善于引导他人表达内心感受，提供温暖的陪伴和支持。'
        }
    ];

    // 添加上下文消息
    const history = state.messages[contact.id] || [];
    const maxContext = parseInt(state.appSettings.maxContextLength) || 10;
    const recentHistory = history.slice(-maxContext);
    
    // 关键修复：排除可能已经存在的当前用户消息
    // 检查历史中最后一条消息是否与当前消息相同
    let filteredHistory = recentHistory;
    if (recentHistory.length > 0) {
        const lastMsg = recentHistory[recentHistory.length - 1];
        // 如果最后一条是用户消息，并且内容与当前消息相似，就排除它
        if (lastMsg.isUser && lastMsg.content === userMessage) {
            filteredHistory = recentHistory.slice(0, -1); // 排除最后一条
        }
    }
    
    filteredHistory.forEach(msg => {
        messages.push({
            role: msg.isUser ? 'user' : 'assistant',
            content: msg.content
        });
    });

    // 添加当前用户消息
    messages.push({
        role: 'user',
        content: userMessage
    });

    // 调试日志：查看实际发送的消息
    console.log('发送API请求消息数组:', messages.map((m, i) => 
        `${i}. ${m.role}: ${m.content.substring(0, 50)}${m.content.length > 50 ? '...' : ''}`
    ));

    try {
        console.log('发送API请求:', {
            url: state.apiConfig.url,
            model: state.apiConfig.model,
            temperature: state.apiConfig.temperature,
            messagesCount: messages.length
        });

            };

            // 添加超时设置

            const timeoutId = setTimeout(() => controller.abort(), 30000); // 30秒超时

            response = await fetch(state.apiConfig.url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${state.apiConfig.key}`
                },
                body: JSON.stringify(requestBody),
                signal: controller.signal
            });

            clearTimeout(timeoutId);

            console.log('响应状态:', response.status);
            console.log('响应状态文本:', response.statusText);

            // 先获取原始响应文本
            const responseText = await response.text();
            console.log('原始响应文本:', responseText.substring(0, 500) + (responseText.length > 500 ? '...' : ''));

            if (!response.ok) {
                // 尝试解析错误信息
                let errorMessage = `API请求失败: ${response.status} ${response.statusText}`;
                try {
                    const errorData = JSON.parse(responseText);
                    errorMessage += ` - ${JSON.stringify(errorData)}`;
                } catch (e) {
                    // 如果不是JSON，使用原始文本
                    errorMessage += ` - ${responseText.substring(0, 200)}`;
                }
                throw new Error(errorMessage);
            }

            // 尝试解析JSON
            let data;
            try {
                data = JSON.parse(responseText);
            } catch (e) {
                console.error('JSON解析失败，原始响应:', responseText);
                
                // 检查是否返回了HTML页面
                if (responseText.includes('<!DOCTYPE') || 
                    responseText.includes('<html') || 
                    responseText.includes('HTTP') ||
                    responseText.includes('nginx') ||
                    responseText.includes('Apache')) {
                    throw new Error('API返回了HTML页面，请检查API地址是否正确');
                }
                
                // 如果不是JSON，尝试从纯文本中提取信息
                if (responseText.trim().length > 0) {
                    // 返回原始文本作为回复
                    return responseText.trim();
                }
                
                throw new Error('API返回了无效的JSON格式');
            }
            
            console.log('解析后的数据:', data);

            // 兼容不同API响应格式
            if (data.choices && data.choices[0] && data.choices[0].message) {
                return data.choices[0].message.content;
            } else if (data.choices && data.choices[0] && data.choices[0].text) {
                return data.choices[0].text;
            } else if (data.response) {
                return data.response;
            } else if (data.content) {
                return data.content;
            } else if (data.message) {
                return data.message;
            } else if (data.result) {
                return data.result;
            } else if (data.text) {
                return data.text;
            } else if (data.answer) {
                return data.answer;
            } else if (data.reply) {
                return data.reply;
            } else if (data.assistant) {
                return data.assistant;
            } else {
                console.error('未知的响应格式:', data);
                // 尝试从data对象中查找任何字符串值
                for (const key in data) {
                    if (typeof data[key] === 'string' && data[key].length > 0) {
                        return data[key];
                    }
                }
                return '收到。';
            }
        } else {
            // 叙说AI
            showAPIStatus('叙说AI服务暂不可用，请使用自定义API', 'error');
            return null;
        }

    } catch (error) {
        console.error('API调用详细错误:', error);
        
        // 提供更具体的错误信息
        if (error.name === 'AbortError') {
            showAPIStatus('请求超时，请检查网络连接或API地址', 'error');
        } else if (error.message.includes('CORS')) {
            showAPIStatus('跨域请求被阻止，请确保API支持CORS', 'error');
        } else if (error.message.includes('HTML页面')) {
            showAPIStatus('API返回了HTML页面，请检查API地址是否正确', 'error');
        } else if (error.message.includes('Failed to fetch')) {
            showAPIStatus('网络连接失败，请检查API地址或网络连接', 'error');
        } else {
            showAPIStatus(`API调用失败: ${error.message}`, 'error');
        }
        
        return null;
    }
}

        // AI帮答功能
        async function getAIHelpSuggestions() {
            if (!state.currentContact) return;
            
            const currentInput = elements.messageInput.value.trim();
            if (!currentInput) return;
            
            // 检查API配置
            if (state.apiConfig.provider === 'custom') {
                if (!state.apiConfig.url || !state.apiConfig.key) {
                    showAPIStatus('请先配置API设置', 'error');
                    return;
                }
            }
            
            // 构建提示词
            const helpPrompt = state.appSettings.aiHelpPrompt;
            const contactInstruction = state.currentContact.roleInstruction;
            
            // 构建消息历史
            const messages = [
                {
                    role: 'system',
                    content: contactInstruction + '\n\n' + helpPrompt
                }
            ];
            
            // 添加上下文
            const contactId = state.currentContact.id;
            const history = state.messages[contactId] || [];
            const maxContext = Math.min(parseInt(state.appSettings.maxContextLength) || 5, 5);
            const recentHistory = history.slice(-maxContext);
            
            recentHistory.forEach(msg => {
                messages.push({
                    role: msg.isUser ? 'user' : 'assistant',
                    content: msg.content
                });
            });
            
            // 添加当前输入
            messages.push({
                role: 'user',
                content: `用户当前的输入是："${currentInput}"。请基于此生成回复建议。`
            });
            
            try {
                let response;
                
                if (state.apiConfig.provider === 'custom') {
                    response = await fetch(state.apiConfig.url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${state.apiConfig.key}`
                        },
                        body: JSON.stringify({
                            model: state.apiConfig.model,
                            messages: messages,
                            temperature: 0.8,
                            max_tokens: 200
                        })
                    });
                } else {
                    return;
                }
                
                if (!response.ok) {
                    throw new Error(`API请求失败: ${response.status}`);
                }
                
                const data = await response.json();
                const suggestionsText = data.choices?.[0]?.message?.content || '';
                
                // 解析建议文本
                const suggestions = suggestionsText.split('\n')
                    .map(s => s.trim().replace(/^\d+[\.\)]?\s*/, ''))
                    .filter(s => s.length > 5 && s.length < 50)
                    .slice(0, 5);
                
                if (suggestions.length > 0) {
                    showAISuggestions(suggestions);
                }
                
            } catch (error) {
                console.error('获取AI建议失败:', error);
            }
        }

            elements.aiSuggestions.innerHTML = '';

        // 搜索功能
        function setupSearch() {
            // 对话设置按钮点击事件
            elements.chatSettingsBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                
                // 切换搜索容器显示

                if (isSearchVisible) {
                    // 如果搜索框已显示，隐藏它

                    // 如果搜索框未显示，显示它并聚焦

                    elements.searchInput.focus();
                }
            });
            
            // 搜索输入事件
            elements.searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                if (searchTerm && state.currentContact) {
                    const contactId = state.currentContact.id;
                    const messages = state.messages[contactId] || [];
                    
                    // 查找匹配的消息
                    state.searchResults = [];
                    messages.forEach(msg => {
                        if (msg.content.toLowerCase().includes(searchTerm)) {
                            state.searchResults.push(msg);
                        }
                    });
                    
                    // 显示搜索结果
                    if (state.searchResults.length > 0) {
                        elements.searchResults.classList.add('active');
                        elements.searchCount.textContent = `找到 ${state.searchResults.length} 个结果`;
                        state.currentSearchIndex = 0;
                        highlightCurrentSearchResult();
                        
                        // 更新导航按钮状态
                        elements.prevResult.disabled = true;
                        elements.nextResult.disabled = state.searchResults.length <= 1;
                    } else {
                        elements.searchResults.classList.remove('active');
                        state.currentSearchIndex = -1;
                    }
                } else {
                    closeSearch();
                }
            });
            
            // 取消搜索按钮
            elements.searchCancelBtn.addEventListener('click', function() {
                closeSearch();
            });
            
            // 上一个结果按钮
            elements.prevResult.addEventListener('click', function() {
                if (state.currentSearchIndex > 0) {
                    state.currentSearchIndex--;
                    highlightCurrentSearchResult();
                    
                    // 更新按钮状态
                    elements.nextResult.disabled = false;
                    if (state.currentSearchIndex === 0) {
                        elements.prevResult.disabled = true;
                    }
                }
            });
            
            // 下一个结果按钮
            elements.nextResult.addEventListener('click', function() {
                if (state.currentSearchIndex < state.searchResults.length - 1) {
                    state.currentSearchIndex++;
                    highlightCurrentSearchResult();
                    
                    // 更新按钮状态
                    elements.prevResult.disabled = false;
                    if (state.currentSearchIndex === state.searchResults.length - 1) {
                        elements.nextResult.disabled = true;
                    }
                }
            });
            
            // 点击页面其他地方关闭搜索
            document.addEventListener('click', function(e) {
                if (!elements.searchContainer.contains(e.target) && 
                    !elements.chatSettingsBtn.contains(e.target) &&
                    !elements.searchResults.contains(e.target)) {
                    closeSearch();
                }
            });
            
            // 阻止搜索容器内的点击事件冒泡
            elements.searchContainer.addEventListener('click', function(e) {
                e.stopPropagation();
            });
        }
        
        // 高亮当前搜索结果

            // 高亮当前匹配项

                const messageElement = document.querySelector(`.message[data-id="${result.id}"]`);
                if (messageElement) {

                    messageElement.scrollIntoView({ behavior: 'smooth', block: 'center' });

            }

            // 更新步骤容器
            elements.stepContainer1.classList.toggle('active', step === 1);
            elements.stepContainer2.classList.toggle('active', step === 2);
        }

        // 显示联系人视图
        function showContactsView() {
            // 显示底部导航栏
            elements.bottomNav.style.display = 'flex';
            
            elements.contactsView.style.display = 'flex';
            elements.chatView.classList.remove('active');
            elements.settingsView.style.display = 'none';
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            elements.navChat.classList.add('active');
            
            closeSearch();
            renderContacts();
        }

        // 显示设置视图
        function showSettingsView() {
            // 显示底部导航栏
            elements.bottomNav.style.display = 'flex';
            
            elements.contactsView.style.display = 'none';
            elements.chatView.classList.remove('active');
            elements.settingsView.style.display = 'block';
            
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            elements.navSettings.classList.add('active');
            
            closeSearch();
        }

        // 初始化应用
        function init() {
            // 从LocalStorage加载数据
            loadFromLocalStorage();
            
            // 设置时间
            updateTime();
            setInterval(updateTime, 60000);
            
            // 渲染初始界面
            renderContacts();
            
            // 设置事件监听
            elements.backBtn.addEventListener('click', () => {
                showContactsView();
            });
            
            elements.sendButton.addEventListener('click', sendMessage);
            
            elements.messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            elements.messageInput.addEventListener('input', autoResizeTextarea);
            
            // 小灯泡点击事件（AI帮答）
            elements.lightbulb.addEventListener('click', async function() {
                if (elements.aiSuggestions.classList.contains('active')) {
                    elements.aiSuggestions.classList.remove('active');
                } else {
                    await getAIHelpSuggestions();
                }
            });
            
            // 导航功能
            elements.navChat.addEventListener('click', () => {
                showContactsView();
            });
            
            elements.navSettings.addEventListener('click', () => {
                showSettingsView();
            });
            
            // 设置页面事件
            elements.apiProvider.addEventListener('change', updateApiProviderDisplay);
            elements.getModelsBtn.addEventListener('click', getAvailableModels);
            elements.modelSelect.addEventListener('change', function() {
                if (this.value) {
                    elements.apiModel.value = this.value;
                }
            });
            
            elements.saveApiConfigBtn.addEventListener('click', saveAPIConfig);
            
            // 保存其他设置
            elements.maxContextLength.addEventListener('change', saveAppSettings);
            elements.autoScroll.addEventListener('change', saveAppSettings);
            elements.aiHelpPrompt.addEventListener('change', saveAppSettings);
            
            // 创建聊天模态框事件
            elements.addContactBtn.addEventListener('click', () => {
                goToStep(1);
                elements.createChatModal.style.display = 'flex';
            });
            
            elements.closeCreateChatModal.addEventListener('click', () => {
                elements.createChatModal.style.display = 'none';
            });
            
            elements.cancelCreateBtn.addEventListener('click', () => {
                elements.createChatModal.style.display = 'none';
            });
            
            elements.nextStepBtn.addEventListener('click', () => {
                const windowName = elements.windowName.value.trim();
                if (!windowName) {
                    showAPIStatus('请填写窗口名称', 'error');
                    return;
                }
                goToStep(2);
            });
            
            elements.prevStepBtn.addEventListener('click', () => {
                goToStep(1);
            });
            
            elements.createChatBtn.addEventListener('click', createChat);
            
            // 确认删除模态框事件
            elements.cancelDeleteBtn.addEventListener('click', hideConfirmDeleteModal);
            elements.confirmDeleteBtn.addEventListener('click', deleteContact);
            
            // 点击模态框外部关闭
            window.addEventListener('click', (e) => {
                if (e.target === elements.createChatModal) {
                    elements.createChatModal.style.display = 'none';
                }
                if (e.target === elements.confirmDeleteModal) {
                    hideConfirmDeleteModal();
                }
            });
            
            // 设置功能
            setupSearch();
            
            // 初始化API提供方显示
            updateApiProviderDisplay();
        }

        // 启动应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
